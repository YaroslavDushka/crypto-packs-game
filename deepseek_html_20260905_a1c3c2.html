    // ---------- УТИЛИТЫ ----------
    function safePath(s) {
        return String(s).replace(/[.#$\/\[\]]/g, '_');
    }

    function loadCloudData(u, cb) {
        db.ref('users/' + safePath(u)).once('value').then(s => {
            cb(s.exists() ? s.val() : null);
        }).catch(() => cb(null));
    }

    function saveCloudGame() {
        if (!currentUser) return;
        db.ref('users/' + safePath(currentUser)).set({
            password: gameData.password,
            balance: gameData.balance,
            cards: gameData.cards || {},
            equipped: gameData.equipped || [],
            inventory: gameData.inventory || [],
            avatar: gameData.avatar || '👤',
            favoriteCard: gameData.favoriteCard || null,
            clan: currentClan || null,
            selectedTank: selectedTank || null,
            packPurchases: gameData.packPurchases || {},
            mutations: gameData.mutations || {}
        }).catch(e => console.error(e));
    }

    function saveLocalGame() {
        localStorage.setItem('cryptoGameData', JSON.stringify(gameData));
    }

    // ---------- МАГАЗИН И ПАКИ ----------
    function generateStore() {
        gameData.store = {};
        gameData.storeTimer = 180;
        PACK_DATA.forEach(p => {
            gameData.store[p.id] = 1 + Math.floor(Math.random() * 4);
        });
        saveLocalGame();
        renderShop();
        updateUI();
        renderInventory();
    }

    function buyPack(id) {
        const p = PACK_DATA.find(x => x.id === id);
        if (!p) return;
        if (!gameData.store[id] || gameData.store[id] <= 0) {
            customMsg("Нет в наличии!", "Этого пакета больше нет.");
            return;
        }
        if (!gameData.packPurchases) gameData.packPurchases = {};
        if (!gameData.packPurchases[id]) gameData.packPurchases[id] = 0;
        let price = p.price * Math.pow(1.05, gameData.packPurchases[id]);
        price = Math.floor(price);
        if (gameData.balance < price) {
            customMsg("Не хватает денег!", `Сейчас этот пакет для тебя стоит $${price}`);
            return;
        }
        if (p.drops.length === 0) {
            customMsg("Пакет пуст!", "В этом пакете пока нет карт.");
            return;
        }
        gameData.balance -= price;
        gameData.store[id]--;
        gameData.inventory.push(id);
        gameData.packPurchases[id]++;
        saveLocalGame();
        saveCloudGame();
        renderShop();
        updateUI();
        renderInventory();
        customMsg("✅ Покупка успешна!", `Вы купили ${p.name} за $${price}!`);
    }

    function openPackFromInventory(idx) {
        if (idx >= gameData.inventory.length) return;
        const pid = gameData.inventory[idx];
        const p = PACK_DATA.find(x => x.id === pid);
        if (!p) return;
        gameData.inventory.splice(idx, 1);
        let card;
        let r = Math.random(),
            cum = 0;
        let drops = p.drops;
        if (Array.isArray(drops) && drops.length > 0 && typeof drops[0] === 'object' && drops[0].chance !== undefined) {
            let sh = [...drops].sort(() => Math.random() - .5);
            for (let item of sh) {
                cum += item.chance;
                if (r <= cum) {
                    card = ALL_CARDS.find(c => c.id === item.id);
                    break;
                }
            }
            if (!card) card = ALL_CARDS.find(c => c.id === sh[sh.length - 1].id);
        } else {
            let sh = [...drops].sort(() => Math.random() - .5);
            for (let c of sh) {
                let card2 = (typeof c === 'string') ? ALL_CARDS.find(x => x.id === c) : c;
                if (card2) {
                    card = card2;
                    break;
                }
            }
            if (!card) card = ALL_CARDS.find(x => x.id === sh[0]);
        }
        if (!card) {
            customMsg("Ошибка", "Не удалось найти карту.");
            return;
        }
        if (!gameData.cards[card.id]) gameData.cards[card.id] = 0;
        gameData.cards[card.id]++;
        saveLocalGame();
        saveCloudGame();
        renderInventory();
        updateUI();
        customMsg("🎉 Открытие!", `Вам выпала: ${card.emoji} ${card.name}! +$${card.income}/сек`);
    }

    function equipOne(id) {
        if (!gameData.cards[id] || gameData.cards[id] <= 0) {
            customMsg("Ошибка", "У вас нет этой карты!");
            return;
        }
        if (gameData.equipped.length >= 10) {
            customMsg("Ошибка", "Максимум 10 карт в экипировке!");
            return;
        }
        gameData.cards[id]--;
        gameData.equipped.push(id);
        saveLocalGame();
        saveCloudGame();
        renderInventory();
        updateUI();
        closeModal();
    }

    function unequipOne(id) {
        const idx = gameData.equipped.indexOf(id);
        if (idx === -1) {
            customMsg("Ошибка", "Эта карта не надета!");
            return;
        }
        gameData.equipped.splice(idx, 1);
        if (!gameData.cards[id]) gameData.cards[id] = 0;
        gameData.cards[id]++;
        saveLocalGame();
        saveCloudGame();
        renderInventory();
        updateUI();
        closeModal();
    }

    function sellOne(id) {
        const card = ALL_CARDS.find(c => c.id === id);
        if (!card) return;
        if (gameData.cards[id] <= 0) {
            customMsg("Ошибка", "У вас нет этой карты для продажи!");
            return;
        }
        const price = Math.floor(card.price / 2);
        gameData.cards[id]--;
        gameData.balance += price;
        const idx = gameData.equipped.indexOf(id);
        if (idx !== -1) gameData.equipped.splice(idx, 1);
        saveLocalGame();
        saveCloudGame();
        renderInventory();
        updateUI();
        closeModal();
    }

    window.openCardMenu = function(id) {
        const card = ALL_CARDS.find(c => c.id === id);
        if (!card) return;
        const modal = document.getElementById('cardModal');
        let imgHtml = '<span style="font-size:32px;">' + card.emoji + '</span>';
        if (card.img) {
            imgHtml = '<img src="' + card.img + '" onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'block\';" style="width:40px;height:40px;object-fit:contain;"><span style="font-size:32px;display:none;">' + card.emoji + '</span>';
        }

        let mutText = '';
        if (gameData.mutations && gameData.mutations[id]) {
            const mut = MUTATIONS[gameData.mutations[id]];
            mutText = `<br><span style="color:#ffb347;">⚡ Мутация: ${mut.emoji} ${mut.name} (x${mut.multiplier})</span>`;
        }

        document.getElementById('modalCardTitle').innerHTML = imgHtml + ' ' + card.name;
        document.getElementById('modalCardDesc').innerHTML = `💰 $${card.price} | 📈 +$${card.income}/сек${mutText}`;
        document.getElementById('modalEquipBtn').onclick = () => equipOne(id);
        document.getElementById('modalUnequipBtn').onclick = () => unequipOne(id);
        document.getElementById('modalSellBtn').innerText = `Продать за $${Math.floor(card.price/2)}`;
        document.getElementById('modalSellBtn').onclick = () => sellOne(id);
        document.getElementById('modalMarketBtn').onclick = () => openSellModal(id);
        document.getElementById('modalAuctionBtn').onclick = () => openAuctionModal(id);
        document.getElementById('modalFavoriteBtn').onclick = () => setFavoriteCard(id);
        document.getElementById('modalCloseBtn').onclick = closeModal;
        modal.classList.add('active');
    };

    function closeModal() {
        document.getElementById('cardModal').classList.remove('active');
    }

    function setFavoriteCard(id) {
        if (!currentUser) {
            customMsg("Ошибка", "Сначала войди в аккаунт!");
            return;
        }
        const card = ALL_CARDS.find(c => c.id === id);
        if (!card) return;
        if (!gameData.cards[id] || gameData.cards[id] <= 0) {
            customMsg("Ошибка", "У тебя нет этой карты!");
            return;
        }
        gameData.favoriteCard = id;
        saveLocalGame();
        saveCloudGame();
        updateProfileUI();
        customMsg("⭐ Любимая карта выбрана!", `${card.emoji} ${card.name} теперь твоя любимая карта!`);
        closeModal();
    }

    // ---------- РАСЧЕТ ДОХОДА С МУТАЦИЯМИ ----------
    function getCardIncome(cardId) {
        const card = ALL_CARDS.find(c => c.id === cardId);
        if (!card) return 0;
        let basePerSec = card.income / 60;
        if (gameData.mutations && gameData.mutations[cardId]) {
            const mut = MUTATIONS[gameData.mutations[cardId]];
            if (mut) basePerSec *= mut.multiplier;
        }
        return basePerSec;
    }

    function getCurrentIncome() {
        let total = 0;
        gameData.equipped.forEach(id => total += getCardIncome(id));
        return total;
    }

    function updateUI() {
        document.getElementById('shopBalance').innerText = `💵 $${Math.floor(gameData.balance)}`;
        let totalIncome = getCurrentIncome();
        document.getElementById('incomeDisplay').innerText = `+$${totalIncome.toFixed(2)}/сек`;
        renderClan();
        if (currentUser && currentClan) {
            const tax = totalIncome * 0.02;
            if (tax > 0.01) {
                db.ref('clans/' + safePath(currentClan) + '/money').transaction(cur => {
                    return (cur || 0) + tax;
                });
            }
        }
    }

    function updateProfileUI() {
        const preview = document.getElementById('profileAvatarPreview');
        if (gameData.avatar && gameData.avatar.startsWith('data:image')) {
            preview.innerHTML = `<img src="${gameData.avatar}" style="width:100%;height:100%;object-fit:cover;">`;
        } else {
            preview.innerHTML = '👤';
        }
        const fav = document.getElementById('favoriteCardDisplay');
        if (gameData.favoriteCard) {
            const card = ALL_CARDS.find(c => c.id === gameData.favoriteCard);
            if (card) {
                let img = `<span style="font-size:32px;">${card.emoji}</span>`;
                if (card.img) {
                    img = `<img src="${card.img}" style="width:50px;height:50px;object-fit:contain;border-radius:6px;background:#0b0e1a;padding:4px;" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span style="font-size:32px;display:none;">${card.emoji}</span>`;
                }
                fav.innerHTML = `<div style="display:flex;align-items:center;gap:10px;background:#111722;padding:8px 16px;border-radius:12px;border:1px solid #ffb347;">${img}<div style="text-align:left;"><div style="font-weight:700;font-size:16px;color:#fff;">${card.name}</div><div style="font-size:12px;color:#64ffda;">+$${(card.income/60).toFixed(2)}/сек</div></div></div>`;
            } else {
                fav.innerHTML = '<span style="color:#8892b0;">Карта не найдена</span>';
            }
        } else {
            fav.innerHTML = '<span style="color:#8892b0;">Выбери любимую карту в инвентаре!</span>';
        }
        if (currentUser) {
            document.getElementById('profileLoginDisplay').innerText = `Ваш логин: ${currentUser}`;
            document.getElementById('globalAvatarBtn').classList.remove('hidden');
            const btn = document.getElementById('globalAvatarBtn');
            if (gameData.avatar && gameData.avatar.startsWith('data:image')) {
                btn.innerHTML = `<img src="${gameData.avatar}" alt="avatar">`;
            } else {
                btn.innerHTML = '<span class="placeholder">👤</span>';
            }
        } else {
            document.getElementById('profileLoginDisplay').innerText = 'Не авторизован';
            document.getElementById('globalAvatarBtn').classList.add('hidden');

    // ---------- ОТРИСОВКА ----------
    function renderShop() {
        const c = document.getElementById('packsContainer');
        c.innerHTML = '';
        let sorted = [...PACK_DATA].sort((a, b) => a.order - b.order);
        sorted.forEach(p => {
            const count = gameData.store[p.id] || 0;
            let price = p.price;
            if (gameData.packPurchases && gameData.packPurchases[p.id]) {
                price = p.price * Math.pow(1.05, gameData.packPurchases[p.id]);
                price = Math.floor(price);
            }
            const div = document.createElement('div');
            div.className = `pack-card rarity-${p.rarity}`;
            div.innerHTML = `<div class="chance-btn" onclick="event.stopPropagation(); showChances('${p.id}')">!</div><img src="${p.img}" onerror="this.remove()"><div class="pack-name">${p.name}</div><div class="pack-rarity">${p.rarity.toUpperCase()}</div><div class="pack-price">$${price}</div><div class="pack-count">В наличии: ${count} шт.</div>`;
            div.onclick = () => buyPack(p.id);
            c.appendChild(div);
        });
    }

    function renderInventory() {
        const eq = document.getElementById('equipContainer');
        eq.innerHTML = '';
        gameData.equipped.forEach(id => {
            const slot = document.createElement('div');
            slot.className = 'equip-slot filled';
            let card = ALL_CARDS.find(c => c.id === id);
            if (card) {
                let imgHtml = card.emoji;
                if (card.img) {
                    imgHtml = `<img src="${card.img}" onerror="this.style.display='none'; this.parentElement.innerText='${card.emoji}';" style="max-width:100%;height:40px;object-fit:contain;">`;
                }
                slot.innerHTML = imgHtml;
                slot.title = `Надета: ${card.name}`;
                slot.onclick = function() { unequipOne(id); };
            }
            eq.appendChild(slot);
        });

        const inv = document.getElementById('invPacksContainer');
        inv.innerHTML = '';
        if (!gameData.inventory || gameData.inventory.length === 0) {
            inv.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;color:#8892b0;">У вас нет закрытых пакетов. Купите в магазине!</div>';
        } else {
            gameData.inventory.forEach((pid, idx) => {
                const p = PACK_DATA.find(x => x.id === pid);
                if (!p) return;
                const div = document.createElement('div');
                div.className = 'inv-pack-item';
                div.innerHTML = `<img src="${p.img}" onerror="this.remove()"><div class="p-name">${p.name}</div>`;
                div.onclick = () => openPackFromInventory(idx);
                inv.appendChild(div);
            });
        }

        const cards = document.getElementById('cardsContainer');
        cards.innerHTML = '';
        let has = false;
        if (gameData.cards) {
            for (let k in gameData.cards) if (gameData.cards[k] > 0) has = true;
        }
        if (!has) {
            cards.innerHTML = '<div class="placeholder" style="padding:30px;text-align:center;">📭 У вас пока нет открытых карт.</div>';
            return;
        }
        const grid = document.createElement('div');
        grid.className = 'cards-grid';
        ALL_CARDS.forEach(card => {
            if (gameData.cards && (gameData.cards[card.id] || 0) > 0) {
                const item = document.createElement('div');
                let mutationClass = '';
                if (gameData.mutations && gameData.mutations[card.id]) {
                    const mutType = gameData.mutations[card.id];
                    mutationClass = `mutated mutation-${mutType}`;
                }

                item.className = `card-item rarity-${card.rarity} ${mutationClass}`;
                let imgHtml = `<span class="card-img">${card.emoji}</span>`;
                if (card.img) {
                    imgHtml = `<img src="${card.img}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="card-img" style="display:none;">${card.emoji}</span>`;
                }

                let badgeHtml = '';
                if (gameData.mutations && gameData.mutations[card.id]) {
                    const mutName = gameData.mutations[card.id].toUpperCase();
                    badgeHtml = `<div class="mutation-badge">${mutName}</div>`;
                }

                item.innerHTML = `${badgeHtml}${imgHtml}<div style="font-size:12px">${card.name}</div><div class="card-income">+${getCardIncome(card.id).toFixed(2)}$/сек</div><div class="card-price">💰 $${card.price}</div><div class="card-count">${gameData.cards[card.id]} шт.</div>`;
                item.onclick = () => openCardMenu(card.id);
                grid.appendChild(item);
            }
        });
        cards.appendChild(grid);
    }

    window.showChances = function(id) {
        const p = PACK_DATA.find(x => x.id === id);
        if (!p || p.drops.length === 0) return;
        let msg = `📊 Шансы выпадения из ${p.name}:\n\n`;
        let drops = p.drops;
        if (Array.isArray(drops) && drops.length > 0 && typeof drops[0] === 'object' && drops[0].chance !== undefined) {
            let sorted = [...drops].sort((a, b) => a.chance - b.chance);
            sorted.forEach(item => {
                let card = ALL_CARDS.find(c => c.id === item.id);
                if (card) msg += `${card.emoji} ${card.name}: ${(item.chance*100).toFixed(1)}%\n`;
            });
        } else {
            let shuffled = [...drops].sort((a, b) => a.dropRate - b.dropRate);
            shuffled.forEach(c => {
                msg += `${c.emoji} ${c.name}: ${(c.dropRate*100).toFixed(1)}%\n`;
            });
        }
        customMsg(`📊 Шансы ${p.name}`, msg);
    };

    // ---------- АДМИН (РАСШИРЕННАЯ КОНСОЛЬ) ----------
    function consoleLog(text, type = 'info') {
        const output = document.getElementById('consoleOutput');
        const line = document.createElement('div');
        line.style.cssText = 'color:' + (type === 'error' ? '#ff6b6b' : type === 'success' ? '#64ffda' : '#e0e6f0') + '; margin: 2px 0;';
        line.innerText = '> ' + text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
    }

    function executeConsoleCommand() {
        const input = document.getElementById('consoleInput');
        const val = input.value.trim();
        if (!val) return;
        input.value = '';
        consoleLog('> ' + val);

        const parts = val.split(/\s+/);
        const cmd = parts[0].toLowerCase();
        const args = parts.slice(1);

        if (cmd === 'help') {
            consoleLog('Доступные команды:', 'info');
            consoleLog('give <ник> <сумма> — выдать деньги');
            consoleLog('take <ник> <сумма> — забрать деньги');
            consoleLog('givecard <ник> <ID_карты> — выдать карту игроку');
            consoleLog('removecard <ник> <ID_карты> [кол-во] — удалить карту');
            consoleLog('equip <ник> <ID_карты> — одеть карту игроку');
            consoleLog('resetinv <ник> — очистить инвентарь');
            consoleLog('givepack <ник> <ID_пака> — выдать пакет');
            consoleLog('refill — пополнить магазин');
            consoleLog('addstore <ID_пака> <кол-во> — добавить паки');
            consoleLog('resetpacks — сбросить цены паков');
            consoleLog('clancreate <название> — создать клан');
            consoleLog('clandelete <название> — удалить клан');
            consoleLog('clanadd <название> <ник> — добавить в клан');
            consoleLog('clanpoints <название> <число> — накрутить очки клану');
            consoleLog('clanmoney <название> <число> — накрутить деньги клану');
            consoleLog('timertop <сек> <текст> — глобальный таймер');
            consoleLog('globalmsg <текст> — сообщение всем');
            consoleLog('addcoins <ID_монеты> <сумма> — добавить ликвидности');
            consoleLog('resetuser <ник> — сбросить игрока до новичка');
            consoleLog('dailypack — выдать паки всем');
            consoleLog('resetall — ПОЛНЫЙ СБРОС ИГРЫ (ОСТОРОЖНО!)');
            consoleLog('spawnroad <ник> <ID_карты> — заспавнить на дорожку');
            consoleLog('mutate <ник> <ID_карты> <gold/diamond/rainbow> — дать мутацию');
            consoleLog('unmutate <ник> <ID_карты> — убрать мутацию');
            consoleLog('lucky <кол-во> <gold/diamond/rainbow> — раздать мутации рандомно');
            consoleLog('event — запустить ивент (шансы x5 на 60 сек)');
            consoleLog('spawn <ID карты> — заспавнить карту себе');
            consoleLog('ban <ник> — забанить игрока');
            consoleLog('unban <ник> — разбанить игрока');
            return;
        }

        // --- НОВЫЕ РАСШИРЕННЫЕ КОМАНДЫ ---
        if (cmd === 'givecard' && args.length >= 2) {
            const target = args[0], cardId = args[1];
            const card = ALL_CARDS.find(c => c.id === cardId);
            if(!card){ consoleLog(`Карта ${cardId} не найдена`, 'error'); return; }
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let cards = d.cards || {}; cards[cardId] = (cards[cardId]||0) + 1;
                db.ref('users/'+safePath(target)+'/cards').set(cards).then(() => consoleLog(`✅ Карта ${card.emoji} ${card.name} выдана ${target}`, 'success'));
            });
            return;
        }

        if (cmd === 'removecard' && args.length >= 2) {
            const target = args[0], cardId = args[1], count = args[2] ? parseInt(args[2]) : 1;
            if(isNaN(count) || count < 1){ consoleLog('Количество должно быть >= 1', 'error'); return; }
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let cards = d.cards || {};
                if(!cards[cardId] || cards[cardId] < count){ consoleLog(`У игрока нет ${count} шт. этой карты`, 'error'); return; }
                cards[cardId] -= count; if(cards[cardId] <= 0) delete cards[cardId];
                db.ref('users/'+safePath(target)+'/cards').set(cards).then(() => consoleLog(`✅ Удалено ${count} шт. карты ${cardId} у ${target}`, 'success'));
            });
            return;
        }

        if (cmd === 'equip' && args.length >= 2) {
            const target = args[0], cardId = args[1];
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let cards = d.cards || {};
                if(!cards[cardId] || cards[cardId] < 1){ consoleLog(`У игрока нет этой карты`, 'error'); return; }
                let equipped = d.equipped || [];
                if(equipped.length >= 10){ consoleLog('Слоты экипировки заполнены (макс 10)', 'error'); return; }
                cards[cardId]--; if(cards[cardId] <= 0) delete cards[cardId];
                equipped.push(cardId);
                const updates = {}; updates['users/'+safePath(target)+'/cards'] = cards; updates['users/'+safePath(target)+'/equipped'] = equipped;
                db.ref().update(updates).then(() => consoleLog(`✅ Карта ${cardId} надета на ${target}`, 'success'));
            });
            return;
        }

        if (cmd === 'resetinv' && args.length >= 1) {
            const target = args[0];
            db.ref('users/'+safePath(target)).update({ inventory: [], cards: {}, equipped: [] }).then(() => consoleLog(`✅ Инвентарь игрока ${target} очищен`, 'success'));
            return;
        }

        if (cmd === 'givepack' && args.length >= 2) {
            const target = args[0], packId = args[1];
            const pack = PACK_DATA.find(p => p.id === packId);
            if(!pack){ consoleLog(`Пакет ${packId} не найден`, 'error'); return; }
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let inv = d.inventory || []; inv.push(packId);
                db.ref('users/'+safePath(target)+'/inventory').set(inv).then(() => consoleLog(`✅ Пакет ${pack.name} выдан ${target}`, 'success'));
            });
            return;
        }

        if (cmd === 'refill') {
            gameData.store = {}; gameData.storeTimer = 180;
            PACK_DATA.forEach(p => gameData.store[p.id] = 4);
            consoleLog('✅ Магазин пополнен (по 4 шт, таймер сброшен)', 'success');
            return;
        }

        if (cmd === 'addstore' && args.length >= 2) {
            const packId = args[0], count = parseInt(args[1]);
            if(isNaN(count) || count < 0){ consoleLog('Укажите корректное количество', 'error'); return; }
            const pack = PACK_DATA.find(p => p.id === packId);
            if(!pack){ consoleLog(`Пакет ${packId} не найден`, 'error'); return; }
            gameData.store[packId] = (gameData.store[packId] || 0) + count;
            consoleLog(`✅ Добавлено ${count} шт. пакетов ${packId} в магазин`, 'success');
            return;
        }

        if (cmd === 'resetpacks') {
            gameData.packPurchases = {};
            consoleLog('✅ Цены всех паков сброшены до начальных', 'success');
            return;
        }

        if (cmd === 'clancreate' && args.length >= 1) {
            const clanName = args[0];
            db.ref('clans/'+safePath(clanName)).set({ name: clanName, owner: 'Admin', members: [], money: 0, points: 0 }).then(() => consoleLog(`✅ Клан ${clanName} создан`, 'success'));
            return;
        }
        if (cmd === 'clandelete' && args.length >= 1) {
            const clanName = args[0];
            db.ref('clans/'+safePath(clanName)).remove().then(() => consoleLog(`✅ Клан ${clanName} удалён`, 'success'));
            return;
        }
        if (cmd === 'clanadd' && args.length >= 2) {
            const clanName = args[0], user = args[1];
            const cPath = 'clans/'+safePath(clanName)+'/members';
            db.ref(cPath).transaction(cur => { if(!cur) cur = []; cur.push(user); return cur; }).then(() => {
                db.ref('users/'+safePath(user)+'/clan').set(clanName);
                consoleLog(`✅ ${user} добавлен в клан ${clanName}`, 'success');
            });
            return;
        }
        if (cmd === 'clanpoints' && args.length >= 2) {
            const clanName = args[0], amount = parseInt(args[1]);
            if(isNaN(amount)){ consoleLog('Укажите число', 'error'); return; }
            db.ref('clans/'+safePath(clanName)+'/points').transaction(cur => (cur||0) + amount).then(() => consoleLog(`✅ Клану ${clanName} начислено ${amount} очков`, 'success'));
            return;
        }
        if (cmd === 'clanmoney' && args.length >= 2) {
            const clanName = args[0], amount = parseInt(args[1]);
            if(isNaN(amount)){ consoleLog('Укажите число', 'error'); return; }
            db.ref('clans/'+safePath(clanName)+'/money').transaction(cur => (cur||0) + amount).then(() => consoleLog(`✅ Клану ${clanName} начислено $${amount}`, 'success'));
            return;
        }

        if (cmd === 'timertop' && args.length >= 2) {
            const sec = parseInt(args[0]); const text = args.slice(1).join(' ');
            if(isNaN(sec) || sec < 1){ consoleLog('Укажите время в секундах', 'error'); return; }
            consoleLog(`🕒 Таймер запущен: ${text} (${sec} сек)`, 'success');
            addNotification('🕒 Глобальный таймер', text, sec * 1000);
            return;
        }
        if (cmd === 'globalmsg') {
            const text = args.join(' ');
            consoleLog(`📢 Глобальное сообщение: ${text}`, 'success');
            db.ref('users').once('value', snap => {
                const users = snap.val();
                for(let u in users){ db.ref('users/'+safePath(u)+'/notifications').push().set({ title: '📢 Админ', text: text, time: Date.now() }); }
            });
            return;
        }

        if (cmd === 'addcoins' && args.length >= 2) {
            const coinId = args[0], amount = parseInt(args[1]);
            if(isNaN(amount)){ consoleLog('Укажите сумму', 'error'); return; }
            db.ref('crypto/coins/'+coinId).once('value', snap => {
                const coin = snap.val(); if(!coin){ consoleLog('Монета не найдена', 'error'); return; }
                const newMoney = (coin.poolMoney||0) + amount; const newSupply = (coin.supply||1) + (amount / (coin.price||1));
                db.ref('crypto/coins/'+coinId).update({ poolMoney: newMoney, supply: newSupply }).then(() => consoleLog(`✅ Добавлено $${amount} ликвидности в ${coin.symbol}`, 'success'));
            });
            return;
        }

        if (cmd === 'resetuser' && args.length >= 1) {
            const target = args[0];
            db.ref('users/'+safePath(target)).set({ balance: 10, cards: {}, equipped: [], inventory: ['pack5','pack5','pack5'], avatar: '👤' }).then(() => consoleLog(`✅ Игрок ${target} сброшен до новичка`, 'success'));
            return;
        }

        if (cmd === 'dailypack') {
            db.ref('users').once('value', snap => {
                const users = snap.val();
                for(let u in users){
                    let inv = users[u].inventory || []; const rPack = PACK_DATA[Math.floor(Math.random()*PACK_DATA.length)];
                    inv.push(rPack.id); db.ref('users/'+safePath(u)+'/inventory').set(inv);
                }
                consoleLog('✅ Всем игрокам выдано по 1 случайному пакету!', 'success');
            });
            return;
        }

        if (cmd === 'resetall') {
            if(!confirm('ВЫ ТОЧНО ХОТИТЕ СБРОСИТЬ ВСЮ ИГРУ? ЭТО НЕОБРАТИМО!')) return;
            db.ref().set(null).then(() => consoleLog('💥 Игра полностью сброшена! Перезагрузите страницу.', 'error'));
            return;
        }

        if (cmd === 'spawnroad' && args.length >= 2) {
            const target = args[0], cardId = args[1];
            const card = ALL_CARDS.find(c => c.id === cardId);
            if(!card){ consoleLog(`Карта ${cardId} не найдена`, 'error'); return; }
            const data = { cardId: cardId, timestamp: Date.now() };
            db.ref('users/'+safePath(target)+'/roadmapSpawn').set(data).then(() => consoleLog(`✅ Карта ${card.emoji} ${card.name} заспавнена на дорожку ${target}`, 'success'));
            return;
        }

        if (cmd === 'mutate' && args.length >= 3) {
            const target = args[0], cardId = args[1], mutType = args[2].toLowerCase();
            if(!MUTATIONS[mutType]){ consoleLog('Доступные мутации: gold, diamond, rainbow', 'error'); return; }
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let cards = d.cards || {};
                if(!cards[cardId] || cards[cardId] < 1){ consoleLog(`У игрока нет этой карты`, 'error'); return; }
                let mutations = d.mutations || {};
                mutations[cardId] = mutType;
                db.ref('users/'+safePath(target)+'/mutations').set(mutations).then(() => consoleLog(`✅ Карте ${cardId} выдана мутация ${MUTATIONS[mutType].emoji} ${mutType}`, 'success'));
            });
            return;
        }

        if (cmd === 'unmutate' && args.length >= 2) {
            const target = args[0], cardId = args[1];
            loadCloudData(target, d => {
                if(!d){ consoleLog(`Игрок ${target} не найден`, 'error'); return; }
                let mutations = d.mutations || {};
                if(!mutations[cardId]){ consoleLog(`У этой карты нет мутации`, 'error'); return; }
                delete mutations[cardId];
                db.ref('users/'+safePath(target)+'/mutations').set(mutations).then(() => consoleLog(`✅ Мутация с карты ${cardId} снята`, 'success'));
            });
            return;
        }

        if (cmd === 'lucky' && args.length >= 2) {
            const count = parseInt(args[0]); const mutType = args[1] ? args[1].toLowerCase() : null;
            if(isNaN(count) || count < 1 || count > 100){ consoleLog('Укажите количество (от 1 до 100)', 'error'); return; }
            if(mutType && !MUTATIONS[mutType]){ consoleLog('Неверный тип мутации. Доступно: gold, diamond, rainbow', 'error'); return; }
            db.ref('users').once('value', snap => {
                const users = snap.val(); let assigned = 0;
                for(let u in users){
                    if(assigned >= count) break;
                    const d = users[u]; let cards = d.cards || {}; let keys = Object.keys(cards).filter(k => cards[k] > 0);
                    if(keys.length === 0) continue;
                    const rCard = keys[Math.floor(Math.random()*keys.length)];
                    let mutations = d.mutations || {}; let finalMut = mutType || Object.keys(MUTATIONS)[Math.floor(Math.random()*Object.keys(MUTATIONS).length)];
                    mutations[rCard] = finalMut; db.ref('users/'+safePath(u)+'/mutations').set(mutations); assigned++;
                }
                consoleLog(`✅ Счастливая мутация выдана ${assigned} игрокам!`, 'success');
            });
            return;
        }

        if (cmd === 'event') {
            if(isEventActive){ consoleLog('Ивент уже активен!', 'error'); return; }
            isEventActive = true;
            addNotification('🎉 ГЛОБАЛЬНЫЙ ИВЕНТ!', 'Шансы мутаций на дорожке увеличены в 5 раз на 60 секунд!', 60000);
            consoleLog('🎉 ИВЕНТ ЗАПУЩЕН! Шансы мутаций x5 на 60 сек.', 'success');
            if(eventEndTimer) clearTimeout(eventEndTimer);
            eventEndTimer = setTimeout(() => { isEventActive = false; consoleLog('⏰ Ивент завершён.', 'info'); }, 60000);
            return;
        }

        // ---------- СТАРЫЕ БАЗОВЫЕ КОМАНДЫ ----------
        if (cmd === 'give') {
            if (args.length < 2) { consoleLog('Используй: give <ник> <сумма>', 'error'); return; }
            const target = args[0];
            const amount = parseInt(args[1]);
            if (isNaN(amount) || amount <= 0) { consoleLog('Сумма должна быть числом > 0', 'error'); return; }
            loadCloudData(target, function(data) {
                if (!data) { consoleLog(`Игрок "${target}" не найден!`, 'error'); return; }
                db.ref('users/' + safePath(target) + '/balance').set((data.balance || 0) + amount).then(() => {
                    consoleLog(`✅ Выдано $${amount} игроку ${target}`, 'success');
                });
            });
            return;
        }

        if (cmd === 'take') {
            if (args.length < 2) { consoleLog('Используй: take <ник> <сумма>', 'error'); return; }
            const target = args[0];
            const amount = parseInt(args[1]);
            if (isNaN(amount) || amount <= 0) { consoleLog('Сумма должна быть числом > 0', 'error'); return; }
            loadCloudData(target, function(data) {
                if (!data) { consoleLog(`Игрок "${target}" не найден!`, 'error'); return; }
                const cur = data.balance || 0;
                if (cur < amount) { consoleLog(`У игрока ${target} недостаточно денег ($${cur})`, 'error'); return; }
                db.ref('users/' + safePath(target) + '/balance').set(cur - amount).then(() => {
                    consoleLog(`✅ Забрано $${amount} у игрока ${target}`, 'success');
                });
            });
            return;
        }

        if (cmd === 'spawn') {
            if (args.length < 1) { consoleLog('Используй: spawn <ID карты>', 'error'); return; }
            const cardId = args[0].toLowerCase();
            const card = ALL_CARDS.find(c => c.id.toLowerCase() === cardId);
            if (!card) { consoleLog(`Карта с ID "${cardId}" не найдена`, 'error'); return; }
            if (!gameData.cards[card.id]) gameData.cards[card.id] = 0;
            gameData.cards[card.id]++;
            saveLocalGame();
            saveCloudGame();
            renderInventory();
            updateUI();
            consoleLog(`✅ Карта ${card.emoji} ${card.name} выдана себе`, 'success');
            return;
        }

        if (cmd === 'ban') {
            if (args.length < 1) { consoleLog('Используй: ban <ник>', 'error'); return; }
            const target = args[0];
            loadCloudData(target, function(data) {
                if (!data) { consoleLog(`Игрок "${target}" не найден!`, 'error'); return; }
                db.ref('users/' + safePath(target) + '/banned').set(true).then(() => {
                    consoleLog(`✅ Игрок ${target} ЗАБАНЕН`, 'success');
                });
            });
            return;
        }

        if (cmd === 'unban') {
            if (args.length < 1) { consoleLog('Используй: unban <ник>', 'error'); return; }
            const target = args[0];
            loadCloudData(target, function(data) {
                if (!data) { consoleLog(`Игрок "${target}" не найден!`, 'error'); return; }
                db.ref('users/' + safePath(target) + '/banned').remove().then(() => {
                    consoleLog(`✅ Игрок ${target} РАЗБАНЕН`, 'success');
                });
            });
            return;
        }

        consoleLog(`❌ Неизвестная команда: ${cmd}. Введи help`, 'error');
    }

    // ---------- АККАУНТЫ ----------
    function getSavedAccounts() {
        try {
            const d = localStorage.getItem('cachedAccounts');
            return d ? JSON.parse(d) : [];
        } catch (e) { return []; }
    }

    function saveAccountsList(list) {
        localStorage.setItem('cachedAccounts', JSON.stringify(list));
    }

    function addAccountToList(login, pass) {
        let list = getSavedAccounts();
        const existing = list.find(a => a.login === login);
        if (existing) {
            existing.pass = pass;
        } else {
            if (list.length >= 3) {
                customMsg("Ошибка", "Нельзя сохранить больше 3 аккаунтов!");
                return false;
            }
            list.push({ login, pass });
        }
        saveAccountsList(list);
        renderSavedAccounts();
        return true;
    }

    function removeAccountFromList(login) {
        let list = getSavedAccounts();
        list = list.filter(a => a.login !== login);
        saveAccountsList(list);
        renderSavedAccounts();
    }

    function renderSavedAccounts() {
        const container = document.getElementById('savedAccountsList');
        const list = getSavedAccounts();
        if (list.length === 0) {
            container.innerHTML = '<div style="color:#8892b0;font-size:14px;">У вас пока нет сохраненных аккаунтов.</div>';
            return;
        }
        container.innerHTML = '';
        list.forEach(acc => {
            const row = document.createElement('div');
            row.style.cssText = 'background:#111722;border:1px solid #2a3348;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;';
            const nameSpan = document.createElement('span');
            nameSpan.style.cssText = 'font-weight:700;color:#64ffda;';
            nameSpan.innerText = acc.login;
            const btnGroup = document.createElement('div');
            btnGroup.style.cssText = 'display:flex;gap:8px;';
            const loginBtn = document.createElement('button');
            loginBtn.className = 'auth-btn';
            loginBtn.style.cssText = 'width:auto;padding:4px 12px;font-size:12px;';
            loginBtn.innerText = 'Войти';
            loginBtn.onclick = function() {
                performLogin(acc.login, acc.pass, true).then(() => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.querySelector('[data-tab="profile"]').classList.add('active');
                    document.getElementById('profile').classList.add('active');
                });
            };
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'auth-btn danger';
            deleteBtn.style.cssText = 'width:auto;padding:4px 12px;font-size:12px;';
            deleteBtn.innerText = '❌';
            deleteBtn.onclick = function() {
                if (currentUser === acc.login) {
                    customMsg("Внимание!", "Вы не можете удалить аккаунт, пока он активен. Сначала выйдите.");
                    return;
                }
                removeAccountFromList(acc.login);
            };
            btnGroup.appendChild(loginBtn);
            btnGroup.appendChild(deleteBtn);
            row.appendChild(nameSpan);
            row.appendChild(btnGroup);
            container.appendChild(row);
        });
    }

    document.getElementById('addAccountBtn').onclick = function() {
        const list = getSavedAccounts();
        if (list.length >= 3) {
            customMsg("Ошибка", "Максимум 3 сохраненных аккаунта.");
            return;
        }
        document.getElementById('authOverlay').classList.remove('hidden');
    };

    // ---------- КРИПТО ----------
    function depositToWallet() {
        if (!currentUser) {
            customMsg("Ошибка", "Сначала войди в аккаунт!");
            return;
        }
        showCustomMsg("Пополнение кошелька", "Введите сумму для перевода с основного баланса на крипто-кошелёк:", [
            { text: 'Ввести', class: 'confirm' }, { text: 'Отмена', class: 'cancel' }
        ]).then(res => {
            if (res === 0) {
                const amount = parseInt(prompt('Сумма в $:'));
                if (isNaN(amount) || amount <= 0) {
                    customMsg("Ошибка", "Введите корректную сумму!");
                    return;
                }
                if (gameData.balance < amount) {
                    customMsg("Ошибка", `Не хватает денег! У тебя $${gameData.balance}.`);
                    return;
                }
                gameData.balance -= amount;
                saveLocalGame();
                saveCloudGame();
                const walletRef = db.ref('crypto/wallet/' + safePath(currentUser));
                walletRef.transaction(cur => {
                    return (cur || 0) + amount;
                }).then(() => {
                    updateUI();
                    renderCryptoMarket();
                    customMsg("✅ Пополнено!", `На кошелёк зачислено $${amount}.`);
                }).catch(err => {
                    gameData.balance += amount;
                    saveLocalGame();
                    saveCloudGame();
                    customMsg("❌ Ошибка", "Не удалось пополнить кошелёк.");
                });
            }
        });
    }

    function withdrawFromWallet() {
        if (!currentUser) {
            customMsg("Ошибка", "Сначала войди в аккаунт!");
            return;
        }
        const walletRef = db.ref('crypto/wallet/' + safePath(currentUser));
        walletRef.once('value').then(snap => {
            const bal = snap.val() || 0;
            if (bal <= 0) {
                customMsg("Ошибка", "На крипто-кошельке нет денег для вывода!");
                return;
            }
            showCustomMsg("Вывод с кошелька", `На кошельке: $${Math.floor(bal)}. Введите сумму для вывода на основной баланс:`, [
                { text: 'Ввести', class: 'confirm' }, { text: 'Отмена', class: 'cancel' }
            ]).then(res => {
                if (res === 0) {
                    const amount = parseInt(prompt('Сумма для вывода в $:'));
                    if (isNaN(amount) || amount <= 0 || amount > bal) {
                        customMsg("Ошибка", "Введите корректную сумму!");
                        return;
                    }
                    gameData.balance += amount;
                    saveLocalGame();
                    saveCloudGame();
                    walletRef.transaction(cur => {
                        return (cur || 0) - amount;
                    }).then(() => {
                        updateUI();
                        renderCryptoMarket();
                        customMsg("✅ Выведено!", `$${amount} переведено на основной баланс.`);
                    }).catch(err => {
                        gameData.balance -= amount;
                        saveLocalGame();
                        saveCloudGame();
                        customMsg("❌ Ошибка", "Не удалось вывести деньги.");
                    });
                }
            });
        }).catch(() => customMsg("Ошибка", "Не удалось получить баланс кошелька."));
    }

    function getWalletBalance(cb) {
        if (!currentUser) return cb(0);
        db.ref('crypto/wallet/' + safePath(currentUser)).once('value').then(s => {
            cb(s.val() || 0);
        }).catch(() => cb(0));
    }

    function getPortfolio(cb) {
        if (!currentUser) return cb({});
        db.ref('crypto/portfolio/' + safePath(currentUser)).once('value').then(s => {
            cb(s.val() || {});
        }).catch(() => cb({}));
    }

        const ref = db.ref('crypto/coins');
        ref.once('value').then(s => {
            if (s.exists()) return;
            const popular = [
                { symbol: 'BTC', name: 'Bitcoin', price: 60000, supply: 21000000, desc: 'Самая популярная криптовалюта' },
                { symbol: 'ETH', name: 'Ethereum', price: 3000, supply: 120000000, desc: 'Лидер смарт-контрактов' },
                { symbol: 'SOL', name: 'Solana', price: 150, supply: 500000000, desc: 'Быстрая блокчейн-платформа' },
                { symbol: 'TON', name: 'Toncoin', price: 5.5, supply: 5000000000, desc: 'Криптовалюта от Telegram' }
            ];

            popular.forEach(p => {

    function createCoin() {
        if (!currentUser) {
            customMsg("Ошибка", "Сначала войди в аккаунт!");
            return;
        }
        const name = document.getElementById('coinName').value.trim();
        const symbol = document.getElementById('coinSymbol').value.trim().toUpperCase();
        const desc = document.getElementById('coinDesc').value.trim();
        const cost = parseInt(document.getElementById('coinCreateCost').value);
        if (!name || !symbol) {
            customMsg("Ошибка", "Введи название и тикер!");
            return;
        }
        if (isNaN(cost) || cost < 1000 || cost > 1000000000) {
            customMsg("Ошибка", "Вклад должен быть от 1000 до 1 000 000 000 $");
            return;
        }
        if (gameData.balance < cost) {
            customMsg("Ошибка", `Не хватает денег на вклад! Нужно $${cost}`);
            return;
        }
        const coinsRef = db.ref('crypto/coins');
        coinsRef.orderByChild('symbol').equalTo(symbol).once('value').then(snap => {
            if (snap.exists()) {
                customMsg("Ошибка", "Монета с таким тикером уже существует!");
                return;
            }
            gameData.balance -= cost;
            saveLocalGame();
            saveCloudGame();
            const newCoinRef = coinsRef.push();
            const coinId = newCoinRef.key;
            const poolCoins = 20;
            const creatorCoins = 100;
            const coinData = { id: coinId, name: name, symbol: symbol, desc: desc || 'Создана игроком', supply: poolCoins, price: cost / poolCoins, poolMoney: cost, creator: currentUser, image: uploadedImageData || null, timestamp: firebase.database.ServerValue.TIMESTAMP };
            const updates = {};
            updates['crypto/coins/' + coinId] = coinData;
            updates['crypto/portfolio/' + safePath(currentUser) + '/' + coinId] = creatorCoins;
            const initHistRef = db.ref('crypto/priceHistory/' + coinId);
            const initHistKey = initHistRef.push().key;
            updates['crypto/priceHistory/' + coinId + '/' + initHistKey] = cost / poolCoins;
            updates['crypto/volume/' + coinId] = 0;
            db.ref().update(updates).then(() => {
                closeCreateModal();
                renderCryptoMarket();
                updateUI();
                customMsg("✅ Монета создана!", `${symbol} создана за $${cost}. Вы получили ${creatorCoins} монет.`);
            }).catch(err => {
                gameData.balance += cost;
                saveLocalGame();
                saveCloudGame();
                customMsg("❌ Ошибка", "Не удалось создать монету.");
            });
        });
    }

    function renderCryptoMarket() {
        if (!currentUser) return;
        const container = document.getElementById('cryptoMarketList');
        container.innerHTML = '<div style="text-align:center;padding:20px;color:#848e9c;">Загрузка рынка...</div>';
        getWalletBalance(walletBal => {
            getPortfolio(portfolio => {
                document.getElementById('walletBalanceDisplay').innerText = `$${Math.floor(walletBal)}`;
                const coinsRef = db.ref('crypto/coins');
                coinsRef.on('value', snapshot => {
                    const data = snapshot.val();
                    if (!data) {
                        container.innerHTML = '<div class="empty-state"><div style="font-size:16px;">Нет монет</div><div style="margin-top:5px;">Создай свою первую криптовалюту!</div></div>';
                        return;
                    }
                    let html = '';
                    const coinIds = Object.keys(data);
                    const sorted = coinIds.sort((a, b) => {
                        const capA = (data[a].price || 0) * (data[a].supply || 0);
                        const capB = (data[b].price || 0) * (data[b].supply || 0);
                        return capB - capA;
                    });
                    sorted.forEach(id => {
                        const coin = data[id];
                        const myBal = portfolio[id] || 0;
                        const price = coin.price || 0.01;
                        const supply = coin.supply || 0;
                        const marketCap = price * supply;
                        let iconHtml = `<div class="coin-icon">${coin.symbol.charAt(0)}</div>`;
                        if (coin.image && coin.image.startsWith('data:image')) {
                            iconHtml = `<div class="coin-icon"><img src="${coin.image}" alt="${coin.symbol}"></div>`;
                        }
                        html += `<div class="coin-row" id="coinRow_${id}"><div class="coin-header" onclick="toggleTradePanel('${id}')">${iconHtml}<div class="coin-name-group"><div class="coin-symbol">${coin.symbol}</div><div class="coin-fullname">${coin.name}</div><div style="font-size:10px;color:#848e9c;">Пул: ${supply}</div></div></div><div class="coin-stats"><div class="coin-price-val" id="priceVal_${id}">$${price.toFixed(2)}</div><div class="coin-marketcap">Cap: $${(marketCap).toFixed(0)}</div><div style="font-size:11px;color:#848e9c;">У вас: ${myBal}</div></div><div class="coin-actions"><button class="btn-trade btn-buy" onclick="event.stopPropagation(); openTrade('${id}','buy')">Купить</button><button class="btn-trade btn-sell" onclick="event.stopPropagation(); openTrade('${id}','sell')">Продать</button></div><div class="trade-panel" id="tradePanel_${id}"><h4>Торговля ${coin.symbol}</h4><div class="trade-inputs"><input type="number" id="tradeAmount_${id}" min="1" value="1" oninput="updateTradeSlider('${id}')"><input type="range" id="tradeSlider_${id}" min="1" max="100" value="1" oninput="updateTradeInput('${id}')"><span style="font-size:12px;color:#848e9c;">x1</span></div><div class="trade-buttons"><button class="btn-trade btn-buy" onclick="executeTrade('${id}','buy')">📈 Купить</button><button class="btn-trade btn-sell" onclick="executeTrade('${id}','sell')">📉 Продать</button></div></div></div>`;
                    });
                    container.innerHTML = html;
                });
            });
        });
    }

    function toggleTradePanel(id) {
        const panel = document.getElementById('tradePanel_' + id);
        if (panel) {
            const isOpen = panel.classList.contains('open');
            document.querySelectorAll('.trade-panel').forEach(p => p.classList.remove('open'));
            if (!isOpen) {
                panel.classList.add('open');
                updateTradeLimits(id);
            }
        }
    }

    function openTrade(id, type) {
        const panel = document.getElementById('tradePanel_' + id);
        document.querySelectorAll('.trade-panel').forEach(p => p.classList.remove('open'));
        if (panel) {
            panel.classList.add('open');
            updateTradeLimits(id);
        }
    }

    function updateTradeLimits(id) {
        const coinRef = db.ref('crypto/coins/' + id);
        coinRef.once('value').then(snap => {
            const coin = snap.val();
            if (!coin) return;
            const price = coin.price || 0.01;
            getWalletBalance(wallet => {
                getPortfolio(portfolio => {
                    const myBal = portfolio[id] || 0;
                    const maxBuy = Math.floor(wallet / price);
                    const input = document.getElementById('tradeAmount_' + id);
                    const slider = document.getElementById('tradeSlider_' + id);
                    if (input && slider) {
                        const maxVal = Math.max(1, maxBuy);
                        input.max = maxVal;
                        slider.max = maxVal;
                        let curVal = parseInt(input.value);
                        if (isNaN(curVal) || curVal < 1) curVal = 1;
                        if (curVal > maxVal) curVal = maxVal;
                        input.value = curVal;
                        slider.value = curVal;
                    }
                });
            });
        }).catch(() => {});
    }

    function updateTradeSlider(id) {
        const input = document.getElementById('tradeAmount_' + id);
        const slider = document.getElementById('tradeSlider_' + id);
        if (input && slider) {
            slider.value = input.value;
        }
    }

    function updateTradeInput(id) {
        const input = document.getElementById('tradeAmount_' + id);
        const slider = document.getElementById('tradeSlider_' + id);
        if (input && slider) {
            input.value = slider.value;
        }
    }

    function executeTrade(id, type) {
        if (!currentUser) {
            customMsg("Ошибка", "Сначала войди в аккаунт!");
            return;
        }
        const amountInput = document.getElementById('tradeAmount_' + id);
        const amount = parseInt(amountInput.value);
        if (isNaN(amount) || amount < 1) {
            customMsg("Ошибка", "Введи корректное количество!");
            return;
        }
        const coinRef = db.ref('crypto/coins/' + id);
        coinRef.once('value').then(snap => {
            const coin = snap.val();
            if (!coin) {
                customMsg("Ошибка", "Монета не найдена!");
                return;
            }
            const price = coin.price || 0.01;
            const supply = coin.supply || 0;
            const poolMoney = coin.poolMoney || 0;
            if (type === 'buy') {
                getWalletBalance(async walletBal => {
                    const totalCost = price * amount;
                    if (walletBal < totalCost) {
                        customMsg("Ошибка", `Не хватает денег на кошельке! Нужно $${totalCost.toFixed(2)}`);
                        return;
                    }
                    if (supply < amount) {
                        customMsg("Ошибка", "Недостаточно монет в пуле!");
                        return;
                    }
                    const newSupply = supply - amount;
                    const newPoolMoney = poolMoney + totalCost;
                    const newPrice = newPoolMoney / newSupply;
                    const updates = {};
                    updates['crypto/wallet/' + safePath(currentUser)] = walletBal - totalCost;
                    updates['crypto/portfolio/' + safePath(currentUser) + '/' + id] = firebase.database.ServerValue.increment(amount);
                    updates['crypto/coins/' + id + '/supply'] = newSupply;
                    updates['crypto/coins/' + id + '/poolMoney'] = newPoolMoney;
                    updates['crypto/coins/' + id + '/price'] = newPrice;
                    const histRef = db.ref('crypto/priceHistory/' + id);
                    const histKey = histRef.push().key;
                    updates['crypto/priceHistory/' + id + '/' + histKey] = newPrice;
                    updates['crypto/volume/' + id] = firebase.database.ServerValue.increment(totalCost);
                    db.ref().update(updates).then(() => {
                        renderCryptoMarket();
                        customMsg("✅ Куплено!", `Куплено ${amount} ${coin.symbol} за $${totalCost.toFixed(0)}.`);
                    }).catch(err => customMsg("❌ Ошибка", "Не удалось выполнить покупку."));
                });
            } else if (type === 'sell') {
                getPortfolio(portfolio => {
                    const myBal = portfolio[id] || 0;
                    if (myBal < amount) {
                        customMsg("Ошибка", `У тебя только ${myBal} монет!`);
                        return;
                    }
                    if (supply + amount > 1000000000) {
                        customMsg("Ошибка", "Нельзя продать так много, лимит пула!");
                        return;
                    }
                    const totalEarn = price * amount;
                    const newSupply = supply + amount;
                    let dropMultiplier = 1 - (0.01 * amount);
                    if (dropMultiplier < 0.5) dropMultiplier = 0.5;
                    let newPrice = price * dropMultiplier;
                    newPrice = Math.max(0.01, newPrice);
                    const newPoolMoney = newPrice * newSupply;
                    const updates = {};
                    updates['crypto/wallet/' + safePath(currentUser)] = firebase.database.ServerValue.increment(totalEarn);
                    updates['crypto/portfolio/' + safePath(currentUser) + '/' + id] = -amount;
                    updates['crypto/coins/' + id + '/supply'] = newSupply;
                    updates['crypto/coins/' + id + '/poolMoney'] = newPoolMoney;
                    updates['crypto/coins/' + id + '/price'] = newPrice;
                    const histRef = db.ref('crypto/priceHistory/' + id);
                    const histKey = histRef.push().key;
                    updates['crypto/priceHistory/' + id + '/' + histKey] = newPrice;
                    updates['crypto/volume/' + id] = firebase.database.ServerValue.increment(totalEarn);
                    db.ref().update(updates).then(() => {
                        renderCryptoMarket();
                        customMsg("✅ Продано!", `Продано ${amount} ${coin.symbol} за $${totalEarn.toFixed(0)}.`);
                    }).catch(err => customMsg("❌ Ошибка", "Не удалось выполнить продажу."));
                });
            }
        });
    }

    function triggerRandomNews() {
        const coinsRef = db.ref('crypto/coins');
        coinsRef.once('value').then(snap => {
            const data = snap.val();
            if (!data) {
                customMsg("Внимание", "Сначала создай хотя бы одну монету!");
                return;
            }
            const ids = Object.keys(data);
            const id = ids[Math.floor(Math.random() * ids.length)];
            const coin = data[id];
            if (!coin) return;
            const currentPrice = coin.price || 0.01;
            const newsPool = [
                { text: `📈 Хайп! Создатель ${coin.symbol} закупился!`, multiplier: 1.4 },
                { text: `🚀 Крупный инвестор зашел в ${coin.symbol}!`, multiplier: 1.3 },
                { text: `💎 ${coin.symbol} анонсировал апгрейд!`, multiplier: 1.25 },
                { text: `🐳 Кит купил много ${coin.symbol}!`, multiplier: 1.35 },
                { text: `🌟 ${coin.symbol} в тренде!`, multiplier: 1.2 },
                { text: `📉 Кит сливает ${coin.symbol}!`, multiplier: .7 },
                { text: `😱 Скандал вокруг ${coin.symbol}!`, multiplier: .75 },
                { text: `🥶 Рынок в шоке! ${coin.symbol} падает!`, multiplier: .65 },
                { text: `🤖 Бот продал весь ${coin.symbol}!`, multiplier: .8 },
                { text: `🔻 ${coin.symbol} потерял поддержку!`, multiplier: .7 },
                { text: `😂 ${coin.symbol} — мем года!`, multiplier: 1.9 }
            ];
            const news = newsPool[Math.floor(Math.random() * newsPool.length)];
            const newPrice = currentPrice * news.multiplier;
            const finalPrice = Math.max(0.01, newPrice);
            const updates = {};
            updates['crypto/coins/' + id + '/price'] = finalPrice;
            updates['crypto/coins/' + id + '/poolMoney'] = finalPrice * coin.supply;
            const histRef = db.ref('crypto/priceHistory/' + id);
            const histKey = histRef.push().key;
            updates['crypto/priceHistory/' + id + '/' + histKey] = finalPrice;
            db.ref().update(updates).then(() => {
                const icon = news.multiplier > 1 ? '🟢' : '🔴';
                document.getElementById('lastNews').innerText = `${icon} ${news.text} (${currentPrice.toFixed(2)}$ → ${finalPrice.toFixed(2)}$)`;
                renderCryptoMarket();
            });
        });
    }

    function openCreateModal() {
        document.getElementById('cryptoCreateModal').classList.add('active');
        document.getElementById('coinName').value = '';
        document.getElementById('coinSymbol').value = '';
        document.getElementById('coinDesc').value = '';
        document.getElementById('coinCreateCost').value = 10000;
        document.getElementById('imgPreview').innerHTML = '📁';
        uploadedImageData = null;
    }

    function closeCreateModal() {
        document.getElementById('cryptoCreateModal').classList.remove('active');
    }

    function previewImage(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(ev) {
                uploadedImageData = ev.target.result;
                document.getElementById('imgPreview').innerHTML = `<img src="${uploadedImageData}" alt="Preview">`;
            };
            reader.readAsDataURL(file);
        }
    }
</script>
