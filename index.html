<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крипто-паки</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; background: #0b0e1a; color: #e0e6f0; overflow: hidden; }
        .app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: #141828; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        
        .content { flex: 1; overflow-y: auto; padding: 20px 20px 100px; scrollbar-width: thin; scrollbar-color: #3b4a6b #141828; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: #3b4a6b; border-radius: 8px; }

        .tab-pane { display: none; animation: fade 0.25s ease; }
        .tab-pane.active { display: block; }

        @keyframes fade { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .content-card { background: #1a2133; border-radius: 20px; padding: 24px; border: 1px solid #2a3348; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .content-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; color: #f0f6fc; display: flex; align-items: center; justify-content: space-between; }

        /* МАГАЗИН - ПАКЕТЫ */
        .packs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .pack-card { background: #111722; border-radius: 16px; padding: 16px; text-align: center; border: 2px solid #2a3348; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; position: relative; }
        .pack-card:active { transform: scale(0.95); }
        .pack-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #0b0e1a; padding: 6px; }
        .pack-card .pack-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .pack-card .pack-rarity { font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 12px; margin-bottom: 4px; }
        .pack-card .pack-price { font-size: 13px; color: #f7931a; background: #1e222d; padding: 4px 12px; border-radius: 12px; margin-top: 4px; }

        /* Цвета редкостей */
        .rarity-legendary { border-color: #ffd700 !important; background: #1a1600 !important; }
        .rarity-legendary .pack-rarity { background: #ffd700; color: #000; }
        .rarity-epic { border-color: #a855f7 !important; background: #1a0b2e !important; }
        .rarity-epic .pack-rarity { background: #a855f7; color: #fff; }
        .rarity-deadly { border-color: #ef4444 !important; background: #1a0808 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .rarity-deadly .pack-rarity { background: #ef4444; color: #fff; }
        .rarity-rare { border-color: #3b82f6 !important; background: #0b1a2e !important; }
        .rarity-rare .pack-rarity { background: #3b82f6; color: #fff; }
        .rarity-common { border-color: #6b7280 !important; }
        .rarity-common .pack-rarity { background: #6b7280; color: #fff; }

        /* КАРТЫ */
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card-item { background: #111722; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #2a3348; display: flex; flex-direction: column; align-items: center; }
        .card-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; margin-bottom: 4px; background: #0b0e1a; }
        .card-item .card-img { font-size: 40px; display: block; margin-bottom: 4px; }
        .card-item .card-count { font-size: 12px; color: #8892b0; margin-bottom: 6px; }
        
        .equip-slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; padding: 15px; background: #0b0e1a; border-radius: 16px; border: 1px solid #2a3348; }
        .equip-slot { width: 50px; height: 50px; background: #111722; border: 2px dashed #2a3348; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #444; }
        .equip-slot.filled { border: 2px solid #64ffda; background: #1a2133; color: #fff; }

        /* ПОДВАЛ */
        .tabs-bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: #111722; border-top: 1px solid #2a3348; display: flex; justify-content: space-around; align-items: center; padding: 8px 4px 12px; z-index: 100; backdrop-filter: blur(4px); }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8892b0; font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; gap: 2px; padding-top: 6px; border-radius: 12px; }
        .tab-btn .icon { font-size: 22px; line-height: 1.2; }
        .tab-btn.active { color: #64ffda; }
        @media (max-width: 480px) { .tab-btn .icon { font-size: 20px; } }
    </style>
</head>
<body>
<div class="app">
    <div class="content" id="contentArea">
        <div class="tab-pane active" id="shop">
            <div class="content-card">
                <h2>🛒 Магазин</h2>
                <div class="packs-grid" id="packsContainer"></div>
            </div>
        </div>
        <div class="tab-pane" id="cards">
            <div class="content-card">
                <h2>🃏 Мои карты</h2>
                <h3 style="font-size: 16px; margin-bottom: 10px; color: #64ffda;">⚔️ Экипировка</h3>
                <div class="equip-slots" id="equipContainer"></div>
                <div id="cardsContainer"></div>
            </div>
        </div>
        <div class="tab-pane" id="leaders"><div class="content-card"><h2>🏆 Лидеры</h2><div class="placeholder" style="text-align:center; padding:30px;">Скоро рейтинг!</div></div></div>
        <div class="tab-pane" id="market"><div class="content-card"><h2>📊 Рынок</h2><div class="placeholder" style="text-align:center; padding:30px;">Скоро биржа!</div></div></div>
        <div class="tab-pane" id="crypto"><div class="content-card"><h2>₿ Криптовалюта</h2><div class="placeholder" style="text-align:center; padding:30px;">Информация о курсах</div></div></div>
        <div class="tab-pane" id="roadmap"><div class="content-card"><h2>🗺️ Дорожка</h2><div class="placeholder" style="text-align:center; padding:30px;">Достижения в разработке!</div></div></div>
    </div>

    <div class="tabs-bottom" id="tabBar">
        <button class="tab-btn active" data-tab="shop"><span class="icon">🛒</span><span class="label">Магазин</span></button>
        <button class="tab-btn" data-tab="cards"><span class="icon">🃏</span><span class="label">Карты</span></button>
        <button class="tab-btn" data-tab="leaders"><span class="icon">🏆</span><span class="label">Лидеры</span></button>
        <button class="tab-btn" data-tab="crypto"><span class="icon">₿</span><span class="label">Крипто</span></button>
        <button class="tab-btn" data-tab="roadmap"><span class="icon">🗺️</span><span class="label">Дорожка</span></button>
    </div>
</div>

<script>
    // ОЧЕНЬ ВАЖНО: сначала настраиваем переключение вкладок
    document.addEventListener('DOMContentLoaded', function() {
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabPanes = document.querySelectorAll('.tab-pane');

        tabButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Убираем активный класс у всех
                tabButtons.forEach(b => b.classList.remove('active'));
                tabPanes.forEach(p => p.classList.remove('active'));
                
                // Добавляем активный класс нажатой кнопке
                this.classList.add('active');
                
                // Показываем нужный блок
                const tabId = this.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });
    });

    // Данные игры (пакеты и карты)
    const ALL_CARDS = [
        { id: 'tsum', name: 'Пакет ЦУМ', emoji: '🛍️', rarity: 'legendary', price: 200 },
        { id: 'bmw', name: 'Пакет BMW', emoji: '👜', rarity: 'epic', price: 100 },
        { id: 'skull', name: 'Череп', emoji: '💀', rarity: 'deadly', price: 50 },
        { id: 'tea', name: 'Чайный пакетик', emoji: '🫖', rarity: 'rare', price: 30 },
        { id: 'pepe', name: 'Pepe', emoji: '🐸', rarity: 'common', price: 10 }
    ];

    const DEADLY_CARDS = [
        { id: 'skull_internet', name: 'Интернет помнит всё', img: 'skull_internet.png', emoji: '♠️', rarity: 'deadly', price: 150, dropRate: 0.40 },
        { id: 'skull_moon', name: 'Помни о смерти', img: 'skull_moon.png', emoji: '🌙', rarity: 'deadly', price: 120, dropRate: 0.30 },
        { id: 'skull_next', name: 'Кто следующий?', img: 'skull_next.png', emoji: '👻', rarity: 'deadly', price: 90, dropRate: 0.20 },
        { id: 'skull_finger', name: 'Крутые скелеты', img: 'skull_finger.png', emoji: '🖕', rarity: 'deadly', price: 60, dropRate: 0.08 },
        { id: 'skull_fh', name: 'Фулл хаус', img: 'skull_fh.png', emoji: '🃏', rarity: 'deadly', price: 40, dropRate: 0.02 }
    ];

    const PACKS = [
        { id: 'pack1', name: 'Легендарный пакет!', img: 'pack_legendary.png', rarity: 'legendary', order: 1, drops: ALL_CARDS.filter(c => c.rarity === 'legendary') },
        { id: 'pack2', name: 'Эпический пакет!', img: 'pack_epic.png', rarity: 'epic', order: 2, drops: ALL_CARDS.filter(c => c.rarity === 'epic') },
        { id: 'pack3', name: 'Смертельный пакет!', img: 'pack_deadly.png', rarity: 'deadly', order: 3, drops: DEADLY_CARDS },
        { id: 'pack4', name: 'Редкий пакет!', img: 'pack_rare.png', rarity: 'rare', order: 4, drops: ALL_CARDS.filter(c => c.rarity === 'rare') },
        { id: 'pack5', name: 'Обычный пакет!', img: 'pack_common.png', rarity: 'common', order: 5, drops: ALL_CARDS.filter(c => c.rarity === 'common') }
    ];

    let gameData = { cards: {}, equipped: [] };
    function loadGame() {
        let data = localStorage.getItem('cryptoGameData');
        if (data) gameData = JSON.parse(data);
    }
    function saveGame() { localStorage.setItem('cryptoGameData', JSON.stringify(gameData)); }
    loadGame();

    function renderShop() {
        const container = document.getElementById('packsContainer');
        container.innerHTML = '';
        PACKS.sort((a,b) => a.order - b.order).forEach(pack => {
            const card = document.createElement('div');
            card.className = `pack-card rarity-${pack.rarity}`;
            card.innerHTML = `<img src="${pack.img}" onerror="this.remove()"><div class="pack-name">${pack.name}</div><div class="pack-rarity">${pack.rarity.toUpperCase()}</div><div class="pack-price">Бесплатно</div>`;
            card.onclick = () => openPack(pack.id);
            container.appendChild(card);
        });
    }

    function openPack(packId) {
        const pack = PACKS.find(p => p.id === packId);
        let randomCard;
        if (pack.rarity === 'deadly') {
            let rand = Math.random(), cum = 0;
            for (let c of DEADLY_CARDS.sort(() => Math.random() - 0.5)) { cum += c.dropRate; if (rand <= cum) { randomCard = c; break; } }
            if (!randomCard) randomCard = DEADLY_CARDS[DEADLY_CARDS.length-1];
        } else {
            let possible = ALL_CARDS.filter(c => c.rarity === pack.rarity);
            randomCard = possible[Math.floor(Math.random() * possible.length)];
        }
        if (!gameData.cards[randomCard.id]) gameData.cards[randomCard.id] = 0;
        gameData.cards[randomCard.id]++;
        saveGame();
        renderCards();
        alert(`Вы получили: ${randomCard.emoji} ${randomCard.name}!`);
    }

    function renderCards() {
        const container = document.getElementById('cardsContainer');
        const equip = document.getElementById('equipContainer');
        container.innerHTML = ''; equip.innerHTML = '';
        
        let has = false;
        for (let k in gameData.cards) if (gameData.cards[k] > 0) has = true;
        if (!has) { container.innerHTML = `<div class="placeholder" style="padding:30px; text-align:center;">📭 У вас пока нет карт.</div>`; return; }

        const grid = document.createElement('div'); grid.className = 'cards-grid';
        [...ALL_CARDS, ...DEADLY_CARDS].forEach(card => {
            if ((gameData.cards[card.id] || 0) > 0) {
                const item = document.createElement('div'); item.className = `card-item rarity-${card.rarity}`;
                let imgHtml = card.img ? `<img src="${card.img}" onerror="this.remove()">` : `<span class="card-img">${card.emoji}</span>`;
                item.innerHTML = `${imgHtml}<div style="font-size:12px">${card.name}</div><div class="card-count">${gameData.cards[card.id]} шт.</div>`;
                grid.appendChild(item);
            }
        });
        container.appendChild(grid);
    }

    renderShop();
    renderCards();
</script>
</body>
</html>
