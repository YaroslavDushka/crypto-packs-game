<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Крипто-паки — Онлайн</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; background: #0b0e1a; color: #e0e6f0; overflow: hidden; }
        .app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: #141828; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        
        /* СТИЛИ ОКНА ВХОДА (КРИПТО-ПАКИ) */
        .auth-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a;
            z-index: 9999;
        }
        .auth-box {
            background: #1a2133;
            border: 2px solid #ffb347;
            border-radius: 40px;
            padding: 40px 30px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 180, 71, 0.2);
        }
        .auth-box h1 { font-size: 28px; margin-bottom: 10px; }
        .auth-box .subtitle { font-size: 14px; color: #8892b0; margin-bottom: 25px; }
        .auth-box input {
            width: 100%;
            padding: 14px 16px;
            margin: 8px 0;
            background: #0b0e1a;
            border: 1px solid #ffb347;
            border-radius: 60px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }
        .auth-box input:focus { border-color: #ffdd88; box-shadow: 0 0 10px rgba(255, 180, 71, 0.3); }
        .auth-box button {
            width: 100%;
            padding: 14px;
            margin: 6px 0;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.1s;
        }
        .auth-box button:active { transform: scale(0.96); }
        .btn-login { background: #ffb347; color: #000; }
        .btn-login:hover { background: #ffcc66; }
        .btn-register { background: #4a4a6a; color: #fff; }
        .btn-register:hover { background: #5a5a7a; }
        .btn-guest { background: #333355; color: #fff; }
        .btn-guest:hover { background: #444466; }
        .error-msg { color: #ff8888; font-size: 14px; margin: 8px 0; min-height: 20px; }

        /* СТИЛИ ИГРЫ */
        .content-card { background: #1a2133; border-radius: 20px; padding: 24px; border: 1px solid #2a3348; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .content-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; color: #f0f6fc; display: flex; align-items: center; justify-content: space-between; }
        .balance-box { background: #101826; padding: 8px 16px; border-radius: 40px; font-size: 14px; border: 1px solid #2a3348; color: #f7931a; display: flex; align-items: center; gap: 6px; }
        .timer-box { background: #101826; padding: 8px 16px; border-radius: 40px; font-size: 14px; border: 1px solid #2a3348; color: #64ffda; display: flex; align-items: center; gap: 6px; }
        .packs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .pack-card { background: #111722; border-radius: 16px; padding: 16px; text-align: center; border: 2px solid #2a3348; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; position: relative; }
        .pack-card:active { transform: scale(0.95); }
        .pack-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #0b0e1a; padding: 6px; }
        .pack-card .pack-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .pack-card .pack-rarity { font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 12px; margin-bottom: 4px; }
        .pack-card .pack-price { font-size: 13px; color: #f7931a; background: #1e222d; padding: 4px 12px; border-radius: 12px; margin-top: 4px; }
        .pack-card .pack-count { font-size: 11px; color: #8892b0; margin-top: 4px; }
        .chance-btn { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; background: rgba(255,255,255,0.1); border: 1px solid #8892b0; color: #fff; border-radius: 50%; font-size: 14px; font-weight: bold; line-height: 20px; text-align: center; cursor: pointer; transition: 0.2s; z-index: 10; }
        .chance-btn:hover { background: #fff; color: #000; }
        .rarity-legendary { border-color: #ffd700 !important; background: #1a1600 !important; }
        .rarity-legendary .pack-rarity { background: #ffd700; color: #000; }
        .rarity-epic { border-color: #a855f7 !important; background: #1a0b2e !important; }
        .rarity-epic .pack-rarity { background: #a855f7; color: #fff; }
        .rarity-deadly { border-color: #ef4444 !important; background: #1a0808 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .rarity-deadly .pack-rarity { background: #ef4444; color: #fff; }
        .rarity-rare { border-color: #3b82f6 !important; background: #0b1a2e !important; }
        .rarity-rare .pack-rarity { background: #3b82f6; color: #fff; }
        .rarity-common { border-color: #6b7280 !important; }
        .rarity-common .pack-rarity { background: #6b7280; color: #fff; }
        .inv-packs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .inv-pack-item { background: #111722; border: 2px solid #2a3348; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .inv-pack-item:active { transform: scale(0.95); }
        .inv-pack-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 6px; background: #0b0e1a; }
        .inv-pack-item .p-name { font-size: 12px; margin-top: 4px; }
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card-item { background: #111722; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #2a3348; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: 0.2s; }
        .card-item:hover { border-color: #64ffda; }
        .card-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; margin-bottom: 4px; background: #0b0e1a; }
        .card-item .card-img { font-size: 40px; display: block; margin-bottom: 4px; }
        .card-item .card-count { font-size: 12px; color: #8892b0; margin-bottom: 6px; }
        .card-item .card-income { font-size: 11px; color: #64ffda; font-weight: bold; margin-bottom: 6px; }
        .card-item .card-price { font-size: 11px; color: #f7931a; margin-bottom: 6px; }
        .equip-slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; padding: 15px; background: #0b0e1a; border-radius: 16px; border: 1px solid #2a3348; min-height: 70px; }
        .equip-slot { width: 50px; height: 50px; background: #111722; border: 2px dashed #2a3348; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #444; }
        .equip-slot.filled { border: 2px solid #64ffda; background: #1a2133; color: #fff; }
        .card-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 999; }
        .card-modal.active { display: flex; }
        .modal-content { background: #1a2133; padding: 24px; border-radius: 20px; max-width: 320px; width: 90%; border: 1px solid #2a3348; text-align: center; }
        .modal-content h3 { font-size: 20px; margin-bottom: 12px; }
        .modal-content p { font-size: 14px; color: #8892b0; margin-bottom: 16px; }
        .modal-btn { display: block; width: 100%; background: #2a3348; border: none; color: #fff; padding: 12px; border-radius: 12px; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .modal-btn:hover { background: #64ffda; color: #000; }
        .modal-btn.sell-btn { background: #4a1a1a; color: #ff6b6b; }
        .modal-btn.sell-btn:hover { background: #ff6b6b; color: #fff; }
        .modal-btn.close-btn { background: #2a3348; }
        .profile-btn { position: fixed; top: 15px; left: 15px; width: 44px; height: 44px; background: #1a2133; border: 1px solid #2a3348; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 150; overflow: hidden; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .profile-btn:hover { border-color: #64ffda; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        .profile-btn .placeholder-emoji { font-size: 22px; }
        .tabs-bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: #111722; border-top: 1px solid #2a3348; display: flex; justify-content: space-around; align-items: center; padding: 8px 4px 12px; z-index: 100; backdrop-filter: blur(4px); }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8892b0; font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; gap: 2px; padding-top: 6px; border-radius: 12px; }
        .tab-btn .icon { font-size: 22px; line-height: 1.2; }
        .tab-btn.active { color: #64ffda; }
        @media (max-width: 480px) { .tab-btn .icon { font-size: 20px; } }
        
        /* СКРЫВАЕМ ИГРУ ПОКА НЕТ ВХОДА */
        #gameContent { display: none; height: 100%; width: 100%; }
    </style>
</head>
<body>

    <!-- ОКНО ВХОДА -->
    <div class="auth-container" id="authContainer">
        <div class="auth-box">
            <h1>🛒 Крипто-паки</h1>
            <div class="subtitle">Вход / Регистрация</div>

            <input type="text" id="loginUsername" placeholder="Ваш никнейм" autocomplete="username">
            <input type="password" id="loginPassword" placeholder="Ваш пароль" autocomplete="current-password">

            <div class="error-msg" id="authMessage"></div>

            <button class="btn-login" id="loginBtn">🔓 Войти</button>
            <button class="btn-register" id="registerBtn">➕ Создать аккаунт</button>
            <button class="btn-guest" id="guestBtn">👤 Войти как гость</button>
        </div>
    </div>

    <!-- ИГРА -->
    <div id="gameContent">
        <div class="app">
            <div class="content" id="contentArea">
                <div class="tab-pane active" id="shop">
                    <div class="content-card">
                        <h2>🛒 Магазин <span class="balance-box" id="shopBalance">💵 $10</span></h2>
                        <div class="packs-grid" id="packsContainer"></div>
                    </div>
                </div>
                <div class="tab-pane" id="inventory">
                    <div class="content-card">
                        <h2>🎒 Инвентарь</h2>
                        <h3 style="font-size: 16px; margin-bottom: 10px; color: #64ffda;">⚔️ Экипировка <span id="incomeDisplay" style="font-size:12px; background:#101826; padding:4px 12px; border-radius:12px;">+$0/сек</span></h3>
                        <div class="equip-slots" id="equipContainer"></div>
                        <div id="invPacksContainer" class="inv-packs-grid"></div>
                        <div id="cardsContainer"></div>
                    </div>
                </div>
                <div class="tab-pane" id="leaders">
                    <div class="content-card">
                        <h2>🏆 Лидеры</h2>
                        <div id="leadersContainer" style="text-align:center; padding:10px 0;">
                            <h3 style="color:#64ffda; margin-bottom:15px;">🏅 Топ-10 игроков</h3>
                            <div id="onlineTopList" style="padding:10px;"></div>
                            <div style="border-top:1px solid #2a3348; padding-top:15px; margin-top:15px;">
                                <div style="color:#8892b0; font-size:13px;">Ваш доход:</div>
                                <div id="yourBestScore" style="font-size:24px; color:#ffd700;">$0/сек</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="market"><div class="content-card"><h2>📊 Рынок</h2><div class="placeholder" style="text-align:center; padding:30px;">🛠️ Раздел в разработке</div></div></div>
                <div class="tab-pane" id="crypto">
                    <div class="content-card">
                        <h2>₿ Криптовалюта</h2>
                        <div class="placeholder" style="padding:30px; text-align:center;">
                            <strong id="cryptoBalance" style="color:#f7931a; font-size:24px;">$10</strong><br>
                            <span style="font-size:14px; color:#64ffda;">Доход: +$0 / сек</span>
                        </div>
                    </div>
                </div>
                <div class="tab-pane" id="roadmap"><div class="content-card"><h2>🗺️ Дорожка</h2><div class="placeholder" style="text-align:center; padding:30px;">Достижения в разработке!</div></div></div>
            </div>
            <div class="tabs-bottom" id="tabBar">
                <button class="tab-btn active" data-tab="shop"><span class="icon">🛒</span><span class="label">Магазин</span></button>
                <button class="tab-btn" data-tab="inventory"><span class="icon">🎒</span><span class="label">Инвентарь</span></button>
                <button class="tab-btn" data-tab="leaders"><span class="icon">🏆</span><span class="label">Лидеры</span></button>
                <button class="tab-btn" data-tab="market"><span class="icon">📊</span><span class="label">Рынок</span></button>
                <button class="tab-btn" data-tab="crypto"><span class="icon">₿</span><span class="label">Крипто</span></button>
                <button class="tab-btn" data-tab="roadmap"><span class="icon">🗺️</span><span class="label">Дорожка</span></button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО КАРТЫ -->
    <div class="card-modal" id="cardModal">
        <div class="modal-content">
            <h3 id="modalCardTitle">Название карты</h3>
            <p id="modalCardDesc">Информация о карте</p>
            <button class="modal-btn" id="modalEquipBtn">Одеть</button>
            <button class="modal-btn" id="modalUnequipBtn">Снять</button>
            <button class="modal-btn sell-btn" id="modalSellBtn">Продать за $0</button>
            <button class="modal-btn close-btn" id="modalCloseBtn">Закрыть</button>
        </div>
    </div>

    <script type="module">
        // ==========================================
        // FIREBASE ПОДКЛЮЧЕНИЕ
        // ==========================================

        import { getDatabase, ref, set, get, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCNeATf03rnrmofZAilQeEGUrREt06F3I8",

          projectId: "cryptopacks-798d3",
          storageBucket: "cryptopacks-798d3.firebasestorage.app",
          messagingSenderId: "243185920568",
          appId: "1:243185920568:web:a619151012e40e0e15d4cd",
          measurementId: "G-EY0K2YKD6T"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // ==========================================
        // ДАННЫЕ ИГРЫ
        // ==========================================
        
        const COMMON_CARDS = [
            { id: 'pepe_dumb', name: 'Тупой Пепе', img: 'пепе/pepe_dumb.png', emoji: '😛', rarity: 'common', price: 10, income: 1, dropRate: 0.35 },
            { id: 'pepe_kawaii', name: 'Милый Пепе', img: 'пепе/pepe_kawaii.png', emoji: '🥹', rarity: 'common', price: 15, income: 2, dropRate: 0.30 },
            { id: 'pepe_sun', name: 'Солнечный Пепе', img: 'пепе/pepe_sun.png', emoji: '🌞', rarity: 'common', price: 20, income: 3, dropRate: 0.20 },
            { id: 'pepe_muscle', name: 'Качок Пепе', img: 'пепе/pepe_muscle.png', emoji: '💪', rarity: 'common', price: 25, income: 5, dropRate: 0.10 },
            { id: 'pepe_jesus', name: 'Святой Пепе', img: 'пепе/pepe_jesus.png', emoji: '✨', rarity: 'common', price: 40, income: 10, dropRate: 0.05 }
        ];

        const DEADLY_CARDS = [
            { id: 'snow_man', name: 'Шедевр из снега', img: 'Мемы_для_пакетов_цум/snow_man.png', emoji: '⛄', rarity: 'deadly', price: 200, income: 600, dropRate: 0.20 },
            { id: 'drake_math', name: 'Д/з по математике', img: 'Мемы_для_пакетов_цум/drake_math.png', emoji: '🤓', rarity: 'deadly', price: 200, income: 600, dropRate: 0.20 },
            { id: 'chair_fall', name: 'Точка невозврата', img: 'Мемы_для_пакетов_цум/chair_fall.png', emoji: '🪑', rarity: 'deadly', price: 200, income: 600, dropRate: 0.20 },
            { id: 'list_rogue', name: 'Список негодников', img: 'Мемы_для_пакетов_цум/list_rogue.png', emoji: '📜', rarity: 'deadly', price: 200, income: 600, dropRate: 0.20 },
            { id: 'cash_register', name: 'Улыбка на кассе', img: 'Мемы_для_пакетов_цум/cash_register.png', emoji: '😭', rarity: 'deadly', price: 200, income: 600, dropRate: 0.20 }
        ];

        const LEGENDARY_CARDS = [
            { id: 'skull_internet', name: 'Интернет помнит всё', img: 'черепок/skull_internet.png', emoji: '♠️', rarity: 'legendary', price: 150, income: 300, dropRate: 0.20 },
            { id: 'skull_moon', name: 'Помни о смерти', img: 'черепок/skull_moon.png', emoji: '🌙', rarity: 'legendary', price: 120, income: 300, dropRate: 0.20 },
            { id: 'skull_fh', name: 'Фулл хаус', img: 'черепок/skull_fh.png', emoji: '🃏', rarity: 'legendary', price: 40, income: 300, dropRate: 0.20 },
            { id: 'skull_next', name: 'Кто следующий?', img: 'черепок/skull_next.png', emoji: '👻', rarity: 'legendary', price: 90, income: 200, dropRate: 0.20 },
            { id: 'skull_finger', name: 'Крутые скелеты', img: 'черепок/skull_finger.png', emoji: '🖕', rarity: 'legendary', price: 60, income: 200, dropRate: 0.20 }
        ];

        const EPIC_CARDS = [
            { id: 'bmw_x5', name: 'BMW X5', img: 'бмв/bmw_x5.png', emoji: '🏎️', rarity: 'epic', price: 150, income: 150, dropRate: 0.20 },
            { id: 'bmw_m5', name: 'BMW M5', img: 'бмв/bmw_m5.png', emoji: '💨', rarity: 'epic', price: 150, income: 150, dropRate: 0.20 },
            { id: 'bmw_i8', name: 'BMW i8', img: 'бмв/bmw_i8.png', emoji: '⚡', rarity: 'epic', price: 150, income: 150, dropRate: 0.20 },
            { id: 'bmw_5_series', name: 'THE 5 Series', img: 'бмв/bmw_5_series.png', emoji: '🌃', rarity: 'epic', price: 150, income: 150, dropRate: 0.20 },
            { id: 'bmw_m5_2026', name: '2026 BMW M5', img: 'бмв/bmw_m5_2026.png', emoji: '🏁', rarity: 'epic', price: 150, income: 150, dropRate: 0.20 }
        ];

        const RARE_CARDS = [
            { id: 'tea_despair', name: 'Отчаяние', img: 'чай/tea_despair.png', emoji: '🍵', rarity: 'rare', price: 50, income: 25, dropRate: 0.20 },
            { id: 'tea_cat', name: 'Кот и Чай', img: 'чай/tea_cat.png', emoji: '🐈', rarity: 'rare', price: 50, income: 25, dropRate: 0.20 },
            { id: 'tea_black_cat', name: 'Пойдем пить чай', img: 'чай/tea_black_cat.png', emoji: '🐈‍⬛', rarity: 'rare', price: 50, income: 25, dropRate: 0.20 },
            { id: 'tea_poseidon', name: 'Посейдон', img: 'чай/tea_poseidon.png', emoji: '🌊', rarity: 'rare', price: 50, income: 25, dropRate: 0.20 },
            { id: 'tea_indian', name: 'Индийский чай', img: 'чай/tea_indian.png', emoji: '☕', rarity: 'rare', price: 50, income: 25, dropRate: 0.20 }
        ];

        const ALL_CARDS = [...DEADLY_CARDS, ...LEGENDARY_CARDS, ...EPIC_CARDS, ...RARE_CARDS, ...COMMON_CARDS];
        const PACK_DATA = [
            { id: 'pack5', name: 'Обычный пакет!', img: 'пепе/pack_common.png', rarity: 'common', order: 5, price: 10, drops: COMMON_CARDS },
            { id: 'pack4', name: 'Редкий пакет!', img: 'чай/pack_rare.png', rarity: 'rare', order: 4, price: 100, drops: RARE_CARDS },
            { id: 'pack2', name: 'Эпический пакет!', img: 'бмв/pack_epic.png', rarity: 'epic', order: 2, price: 6700, drops: EPIC_CARDS },
            { id: 'pack3', name: 'Смертельный пакет!', img: 'черепок/pack_deadly.png', rarity: 'deadly', order: 3, price: 50000, drops: DEADLY_CARDS },
            { id: 'pack1', name: 'Легендарный пакет!', img: 'Мемы_для_пакетов_цум/pack_legendary.png', rarity: 'legendary', order: 1, price: 10000, drops: LEGENDARY_CARDS }
        ];

        // ==========================================
        // ЛОГИКА ИГРЫ
        // ==========================================

        let gameData = { balance: 10, cards: {}, equipped: [], inventory: [], store: {}, storeTimer: 300, avatar: '' };
        
        function loadLocalGame() {
            let data = localStorage.getItem('cryptoGameData');
            if (data) {
                gameData = JSON.parse(data);
                if (!gameData.store || Object.keys(gameData.store).length === 0) generateStore();
            } else {
                generateStore();
                for(let i=0; i<3; i++) gameData.inventory.push('pack5');
            }
            if (gameData.balance === undefined) gameData.balance = 10;
            if (!gameData.avatar) gameData.avatar = '';
        }
        function saveLocalGame() { localStorage.setItem('cryptoGameData', JSON.stringify(gameData)); }

        function generateStore() {
            gameData.store = {};
            gameData.storeTimer = 300;
            PACK_DATA.forEach(p => {
                let count = Math.floor(Math.random() * 4);
                gameData.store[p.id] = count;
            });
            saveLocalGame();
            renderShop();
            updateUI();
            renderInventory();
        }

        function buyPack(packId) {
            const pack = PACK_DATA.find(p => p.id === packId);
            if (!pack) return;
            if (!gameData.store[packId] || gameData.store[packId] <= 0) { alert("Этого пакета нет в наличии!"); return; }
            if (gameData.balance < pack.price) { alert(`Не хватает денег! Нужно $${pack.price}`); return; }

            gameData.balance -= pack.price;
            gameData.store[packId]--;
            gameData.inventory.push(packId);

            saveLocalGame(); saveCloudGame();
            renderShop(); updateUI(); renderInventory();
            alert(`✅ Вы купили ${pack.name}!\nОн лежит в вашем Инвентаре.`);
        }

        function openPackFromInventory(index) {
            if (index >= gameData.inventory.length) return;
            const packId = gameData.inventory[index];
            const pack = PACK_DATA.find(p => p.id === packId);
            if (!pack) return;
            if (pack.drops.length === 0) { alert("Этот пакет пуст!"); return; }

            gameData.inventory.splice(index, 1);

            let randomCard;
            let rand = Math.random(), cum = 0;
            let shuffled = [...pack.drops].sort(() => Math.random() - 0.5);
            for (let c of shuffled) { cum += c.dropRate; if (rand <= cum) { randomCard = c; break; } }
            if (!randomCard) randomCard = shuffled[shuffled.length-1];

            if (!gameData.cards[randomCard.id]) gameData.cards[randomCard.id] = 0;
            gameData.cards[randomCard.id]++;

            saveLocalGame(); saveCloudGame();
            renderInventory(); updateUI();
            alert(`🎉 Вам выпала карта:\n${randomCard.emoji} ${randomCard.name}!\nДоход: +$${randomCard.income}/сек`);
        }

        // ==========================================
        // МЕНЮ УПРАВЛЕНИЯ КАРТАМИ
        // ==========================================

        let selectedCardId = null;
        
        function equipOne(cardId) {
            const card = ALL_CARDS.find(c => c.id === cardId);
            if (!card) return;
            if (!gameData.cards[cardId] || gameData.cards[cardId] <= 0) {
                alert("У вас нет этой карты!");
                return;
            }
            gameData.equipped.push(cardId);
            saveLocalGame(); saveCloudGame();
            renderInventory(); updateUI(); closeCardModal();
            alert(`Одета 1 шт. ${card.name}!`);
        }

        function unequipOne(cardId) {
            const idx = gameData.equipped.indexOf(cardId);
            if (idx === -1) {
                alert("Эта карта не надета!");
                return;
            }
            gameData.equipped.splice(idx, 1);
            saveLocalGame(); saveCloudGame();
            renderInventory(); updateUI(); closeCardModal();
            alert(`Снята 1 шт. ${card.name}!`);
        }

        function sellOne(cardId) {
            const card = ALL_CARDS.find(c => c.id === cardId);
            if (!card) return;
            if (gameData.cards[cardId] <= 0) {
                alert("У вас нет этой карты для продажи!");
                return;
            }
            const sellPrice = Math.floor(card.price / 2);
            gameData.cards[cardId]--;
            gameData.balance += sellPrice;
            const idx = gameData.equipped.indexOf(cardId);
            if (idx !== -1) gameData.equipped.splice(idx, 1);
            saveLocalGame(); saveCloudGame();
            renderInventory(); updateUI(); closeCardModal();
            alert(`Продана 1 шт. ${card.name} за $${sellPrice}!`);
        }

        window.openCardMenu = function(cardId) {
            selectedCardId = cardId;
            const card = ALL_CARDS.find(c => c.id === cardId);
            if (!card) return;
            const modal = document.getElementById('cardModal');
            document.getElementById('modalCardTitle').innerText = `${card.emoji} ${card.name}`;
            document.getElementById('modalCardDesc').innerHTML = `💰 Цена: $${card.price}<br>📈 Доход: +$${card.income}/сек<br>📦 В наличии: ${gameData.cards[card.id] || 0} шт.`;
            
            document.getElementById('modalEquipBtn').onclick = () => equipOne(cardId);
            document.getElementById('modalUnequipBtn').onclick = () => unequipOne(cardId);
            document.getElementById('modalSellBtn').innerText = `Продать за $${Math.floor(card.price/2)}`;
            document.getElementById('modalSellBtn').onclick = () => sellOne(cardId);
            document.getElementById('modalCloseBtn').onclick = closeCardModal;
            modal.classList.add('active');
        };

        function closeCardModal() { document.getElementById('cardModal').classList.remove('active'); }

        // ==========================================
        // СИСТЕМА АВТОРИЗАЦИИ (Firebase)
        // ==========================================

        let currentUser = null;
        let currentAvatarBase64 = '';

        async function loadCloudData(username) {
            try {
                const userRef = ref(db, 'users/' + username);
                const snapshot = await get(userRef);
                if (snapshot.exists()) {
                    return snapshot.val();
                }
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
            return null;
        }

        async function saveCloudGame() {
            if (!currentUser) return;
            try {
                const userRef = ref(db, 'users/' + currentUser);
                await set(userRef, {
                    password: gameData.password || '',
                    balance: gameData.balance,
                    cards: gameData.cards || {},
                    equipped: gameData.equipped || [],
                    inventory: gameData.inventory || [],
                    avatar: gameData.avatar || ''
                });
            } catch (e) {
                console.error("Ошибка сохранения:", e);
            }
        }

        async function deleteAccount(username) {
            try {
                const userRef = ref(db, 'users/' + username);
                await remove(userRef);
                localStorage.removeItem('cryptoGameData');
                localStorage.removeItem('cachedUser');
                currentUser = null;
                location.reload();
            } catch (e) {
                console.error("Ошибка удаления:", e);
            }
        }

        function handleRegister() {
            const login = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!login || !pass) { document.getElementById('authMessage').innerText = 'Заполните все поля'; return; }

            loadCloudData(login).then(data => {
                if (data) {
                    document.getElementById('authMessage').innerText = 'Этот логин уже занят!';
                    return;
                }
                
                gameData.balance = 10;
                gameData.cards = {};
                gameData.equipped = [];
                gameData.inventory = [];
                gameData.avatar = '';
                gameData.password = pass;
                currentUser = login;
                localStorage.setItem('cachedUser', login);
                
                saveLocalGame();
                saveCloudGame().then(() => {
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('gameContent').style.display = 'block';
                    renderProfile();
                    renderShop();
                    renderInventory();
                    updateUI();
                    renderLeaders();
                });
            });
        }

        function handleLogin() {
            const login = document.getElementById('loginUsername').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();
            if (!login || !pass) { document.getElementById('authMessage').innerText = 'Заполните все поля'; return; }

            loadCloudData(login).then(data => {
                if (!data) {
                    document.getElementById('authMessage').innerText = 'Пользователь не найден!';
                    return;
                }
                if (data.password !== pass) {
                    document.getElementById('authMessage').innerText = 'Неверный пароль!';
                    return;
                }
                
                gameData.balance = data.balance || 10;
                gameData.cards = data.cards || {};
                gameData.equipped = data.equipped || [];
                gameData.inventory = data.inventory || [];
                gameData.avatar = data.avatar || '';
                gameData.password = data.password || pass;
                currentUser = login;
                localStorage.setItem('cachedUser', login);
                saveLocalGame();
                
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('gameContent').style.display = 'block';
                renderProfile();
                renderShop();
                renderInventory();
                updateUI();
                renderLeaders();
            });
        }

        function handleGuest() {
            let guestName = 'Гость_' + Math.floor(Math.random() * 1000000);
            loadCloudData(guestName).then(data => {
                while (data) {
                    guestName = 'Гость_' + Math.floor(Math.random() * 1000000);
                    loadCloudData(guestName).then(d => data = d);
                }
                const guestPass = 'guest_' + Math.random().toString(36).substr(2, 8);
                gameData.balance = 10;
                gameData.cards = {};
                gameData.equipped = [];
                gameData.inventory = [];
                gameData.avatar = '';
                gameData.password = guestPass;
                currentUser = guestName;
                localStorage.setItem('cachedUser', guestName);
                saveLocalGame();
                saveCloudGame().then(() => {
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('gameContent').style.display = 'block';
                    renderProfile();
                    renderShop();
                    renderInventory();
                    updateUI();
                    renderLeaders();
                });
            });
        }

        // ==========================================
        // UI ОТРИСОВКА
        // ==========================================

        function updateUI() {
            document.getElementById('shopBalance').innerText = `💵 $${Math.floor(gameData.balance)}`;
            try {
                const cryptoElem = document.getElementById('cryptoBalance');
                if (cryptoElem) cryptoElem.innerText = `$${Math.floor(gameData.balance)}`;
            } catch (e) {}
            
            let totalIncome = 0;
            if (gameData.equipped && gameData.equipped.length > 0) {
                gameData.equipped.forEach(id => {
                    let card = ALL_CARDS.find(c => c.id === id);
                    if (card) totalIncome += card.income;
                });
            }
            document.getElementById('incomeDisplay').innerText = `+$${totalIncome}/сек`;
            document.getElementById('yourBestScore').innerText = `$${totalIncome}/сек`;
            try {
                const cryptoDesc = document.querySelector('#crypto .placeholder span:last-child');
                if (cryptoDesc) cryptoDesc.innerText = `Доход: +$${totalIncome} / сек`;
            } catch (e) {}
        }

        function renderProfile() {
            const btn = document.getElementById('profileBtn');
            if (gameData.avatar && gameData.avatar.startsWith('data:image')) {
                btn.innerHTML = `<img src="${gameData.avatar}" alt="Avatar">`;
            } else {
                btn.innerHTML = `<span class="placeholder-emoji">👤</span>`;
            }
        }

        function renderShop() {
            const container = document.getElementById('packsContainer');
            container.innerHTML = '';
            let sorted = [...PACK_DATA].sort((a,b) => a.order - b.order);
            sorted.forEach(pack => {
                const count = gameData.store[pack.id] || 0;
                const card = document.createElement('div');
                card.className = `pack-card rarity-${pack.rarity}`;
                card.innerHTML = `
                    <div class="chance-btn" onclick="event.stopPropagation(); showChances('${pack.id}')">!</div>
                    <img src="${pack.img}" onerror="this.remove()">
                    <div class="pack-name">${pack.name}</div>
                    <div class="pack-rarity">${pack.rarity.toUpperCase()}</div>
                    <div class="pack-price">$${pack.price}</div>
                    <div class="pack-count">В наличии: ${count} шт.</div>
                `;
                card.onclick = () => buyPack(pack.id);
                container.appendChild(card);
            });
        }

        function renderInventory() {
            const equipContainer = document.getElementById('equipContainer');
            equipContainer.innerHTML = '';
            if (gameData.equipped && gameData.equipped.length > 0) {
                gameData.equipped.forEach(cardId => {
                    const slot = document.createElement('div');
                    slot.className = 'equip-slot filled';
                    let card = ALL_CARDS.find(c => c.id === cardId);
                    if (card) {
                        slot.innerHTML = card.emoji;
                        slot.title = `Надета: ${card.name}`;
                    }
                    equipContainer.appendChild(slot);
                });
            }

            const invCont = document.getElementById('invPacksContainer');
            invCont.innerHTML = '';
            if (!gameData.inventory || gameData.inventory.length === 0) {
                invCont.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:20px; color:#8892b0;">У вас нет закрытых пакетов. Купите в магазине!</div>`;
            } else {
                gameData.inventory.forEach((packId, index) => {
                    const pack = PACK_DATA.find(p => p.id === packId);
                    if (!pack) return;
                    const div = document.createElement('div');
                    div.className = 'inv-pack-item';
                    div.innerHTML = `<img src="${pack.img}" onerror="this.remove()"><div class="p-name">${pack.name}</div>`;
                    div.onclick = () => openPackFromInventory(index);
                    invCont.appendChild(div);
                });
            }

            const container = document.getElementById('cardsContainer');
            container.innerHTML = '';
            let has = false;
            if (gameData.cards) {
                for (let k in gameData.cards) if (gameData.cards[k] > 0) has = true;
            }
            if (!has) { 
                container.innerHTML = `<div class="placeholder" style="padding:30px; text-align:center;">📭 У вас пока нет открытых карт.</div>`; 
                return; 
            }
            const grid = document.createElement('div'); grid.className = 'cards-grid';
            ALL_CARDS.forEach(card => {
                if (gameData.cards && (gameData.cards[card.id] || 0) > 0) {
                    const item = document.createElement('div'); 
                    item.className = `card-item rarity-${card.rarity}`;
                    let imgHtml = `<span class="card-img">${card.emoji}</span>`;
                    if (card.img) {
                        imgHtml = `<img src="${card.img}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="card-img" style="display:none;">${card.emoji}</span>`;
                    }
                    item.innerHTML = `
                        ${imgHtml}
                        <div style="font-size:12px">${card.name}</div>
                        <div class="card-income">+$${card.income}/сек</div>
                        <div class="card-price">💰 $${card.price}</div>
                        <div class="card-count">${gameData.cards[card.id]} шт.</div>
                    `;
                    item.onclick = () => openCardMenu(card.id);
                    grid.appendChild(item);
                }
            });
            container.appendChild(grid);
        }

        window.showChances = function(packId) {
            const pack = PACK_DATA.find(p => p.id === packId);
            if (!pack || pack.drops.length === 0) { alert("Шансы не настроены."); return; }
            let msg = `📊 Шансы выпадения из ${pack.name}:\n\n`;
            let shuffled = [...pack.drops].sort((a,b) => a.dropRate - b.dropRate);
            shuffled.forEach(c => { msg += `${c.emoji} ${c.name}: ${(c.dropRate * 100).toFixed(0)}%\n`; });
            alert(msg);
        };

        function renderLeaders() {
            const topRef = ref(db, 'users');
            onValue(topRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                let allPlayers = [];
                for (let key in data) {
                    let p = data[key];
                    let income = 0;
                    if (p.equipped) {
                        p.equipped.forEach(id => {
                            let card = ALL_CARDS.find(c => c.id === id);
                            if (card) income += card.income;
                        });
                    }
                    allPlayers.push({ name: key, income: income, avatar: p.avatar || '' });
                }
                const sorted = allPlayers.sort((a,b) => b.income - a.income).slice(0, 10);
                const container = document.getElementById('onlineTopList');
                let html = '';
                sorted.forEach((player, index) => {
                    const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index+1}.`;
                    let avatarHtml = player.avatar && player.avatar.startsWith('data:image') 
                        ? `<img src="${player.avatar}" style="width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:4px;">` 
                        : '';
                    html += `<div style="display:flex; justify-content:space-between; padding:6px 10px; border-bottom:1px solid #2a3348; align-items:center;">
                                <span>${medal} ${avatarHtml}${player.name}</span>
                                <span style="color:#ffd700;">$${player.income}/сек</span>
                            </div>`;
                });
                if (sorted.length === 0) html = `<p style="color:#8892b0;">Пока нет других игроков.</p>`;
                container.innerHTML = html;
            });
        }

        // ==========================================
        // ОБРАБОТЧИКИ И ЗАПУСК
        // ==========================================

        document.getElementById('loginBtn').addEventListener('click', handleLogin);
        document.getElementById('registerBtn').addEventListener('click', handleRegister);
        document.getElementById('guestBtn').addEventListener('click', handleGuest);

        // БЕЗОПАСНОСТЬ: Проверяем, есть ли кнопка профиля перед добавлением события
        setTimeout(() => {
            const profileBtn = document.getElementById('profileBtn');
            if (profileBtn) {
                profileBtn.addEventListener('click', () => {
                    // Действие при нажатии на профиль
                    alert("Профиль: " + (currentUser || "Не авторизован"));
                });
            }
        }, 100);

        // Автоматический вход при перезагрузке
        const cachedUser = localStorage.getItem('cachedUser');
        if (cachedUser) {
            loadCloudData(cachedUser).then(data => {
                if (data) {
                    gameData.balance = data.balance || 10;
                    gameData.cards = data.cards || {};
                    gameData.equipped = data.equipped || [];
                    gameData.inventory = data.inventory || [];
                    gameData.avatar = data.avatar || '';
                    gameData.password = data.password || '';
                    currentUser = cachedUser;
                    saveLocalGame();
                    document.getElementById('authContainer').style.display = 'none';
                    document.getElementById('gameContent').style.display = 'block';
                    renderProfile();
                    renderShop();
                    renderInventory();
                    updateUI();
                    renderLeaders();
                }
            });
        }

        // Вкладки
        document.addEventListener('DOMContentLoaded', function() {
            const tabButtons = document.querySelectorAll('.tab-btn');
            const tabPanes = document.querySelectorAll('.tab-pane');
            tabButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    tabButtons.forEach(b => b.classList.remove('active'));
                    tabPanes.forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    document.getElementById(this.getAttribute('data-tab')).classList.add('active');
                });
            });
        });

        // Таймер магазина
        setInterval(() => {
            if (gameData.storeTimer > 0) {
                gameData.storeTimer--;
                let m = Math.floor(gameData.storeTimer / 60);
                let s = gameData.storeTimer % 60;
                document.getElementById('shopTimer').innerText = `⏳ ${m}:${s < 10 ? '0'+s : s}`;
            } else {
                generateStore();
            }
        }, 1000);

        // Пассивный доход
        setInterval(() => {
            let totalIncome = 0;
            if (gameData.equipped && gameData.equipped.length > 0) {
                gameData.equipped.forEach(id => {
                    let card = ALL_CARDS.find(c => c.id === id);
                    if (card) totalIncome += card.income;
                });
            }
            if (totalIncome > 0) {
                gameData.balance = (gameData.balance || 0) + totalIncome;
                saveLocalGame(); saveCloudGame();
                updateUI();
            }
        }, 1000);

        // Инициализация при старте
        loadLocalGame();
        if (!cachedUser) {
            document.getElementById('authContainer').style.display = 'flex';
            document.getElementById('gameContent').style.display = 'none';
        }
    </script>
</body>
</html>
