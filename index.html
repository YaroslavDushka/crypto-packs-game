<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>₿</text></svg>">
    <title>Крипто-паки · Кланы</title>
    <style>
        /* --- СТИЛИ ИГРЫ --- */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        html, body { height: 100%; background: #0b0e11; color: #e0e6f0; overflow: hidden; font-size: 16px; }
        .app { display: flex; flex-direction: column; height: 100%; max-width: 600px; margin: 0 auto; background: #141828; position: relative; box-shadow: 0 0 30px rgba(0,0,0,0.7); }
        
        .content { flex: 1; overflow-y: auto; padding: 20px 20px 100px; scrollbar-width: thin; scrollbar-color: #3b4a6b #141828; }
        .content::-webkit-scrollbar { width: 4px; }
        .content::-webkit-scrollbar-thumb { background: #3b4a6b; border-radius: 8px; }

        .tab-pane { display: none; animation: fade 0.25s ease; }
        .tab-pane.active { display: block; }

        @keyframes fade { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .content-card { background: #1a2133; border-radius: 20px; padding: 24px; border: 1px solid #2a3348; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); margin-bottom: 20px; }
        .content-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 16px; color: #f0f6fc; display: flex; align-items: center; justify-content: space-between; }

        /* --- АВАТАРКА И КНОПКА ПОЧТЫ --- */
        .avatar-actions-container { position: fixed; top: 15px; left: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 200; }
        
        .global-avatar-btn { width: 44px; height: 44px; background: #1a2133; border: 2px solid #ffb347; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; box-shadow: 0 0 15px rgba(255, 180, 71, 0.2); transition: 0.2s; }
        .global-avatar-btn:hover { border-color: #64ffda; transform: scale(1.05); }
        .global-avatar-btn img { width: 100%; height: 100%; object-fit: cover; }
        .global-avatar-btn .placeholder { font-size: 20px; }

        .global-mail-btn { width: 44px; height: 44px; background: #1a2133; border: 2px solid #64ffda; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(100, 255, 218, 0.2); transition: 0.2s; font-size: 20px; color: #64ffda; }
        .global-mail-btn:hover { border-color: #ffb347; transform: scale(1.05); }
        .global-mail-btn .unread-badge { position: absolute; top: -4px; right: -4px; background: #ef4444; border-radius: 50%; width: 16px; height: 16px; font-size: 10px; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #fff; border: 2px solid #0b0e11; }

        /* --- АВТОРИЗАЦИЯ --- */
        .auth-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; display:flex; align-items:center; justify-content:center; }
        .auth-overlay.hidden { display:none; }
        .auth-box { background:#1a2133; padding:30px; border-radius:20px; border:1px solid #ffb347; width:90%; max-width:380px; text-align:center; }
        .auth-box h2 { color:#fff; margin-bottom:20px; }
        .auth-input { width:100%; padding:12px; margin:8px 0; background:#0b0e1a; border:1px solid #2a3348; border-radius:12px; color:#fff; font-size:15px; }
        .auth-input:focus { outline:2px solid #64ffda; }
        .auth-btn { width:100%; padding:12px; margin:6px 0; background:#ffb347; border:none; border-radius:12px; font-size:16px; font-weight:bold; cursor:pointer; color:#000; }
        .auth-btn:hover { background:#ffcc66; }
        .auth-btn.danger { background:#4a1a1a; color:#ff6b6b; }
        .auth-btn.danger:hover { background:#ff6b6b; color:#fff; }

        /* --- ОКНО СООБЩЕНИЙ --- */
        .custom-msg-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; align-items:center; justify-content:center; }
        .custom-msg-overlay.active { display:flex; }
        .custom-msg-box { background: #1a2133; padding: 25px; border-radius: 20px; border: 2px solid #ffb347; max-width: 340px; width: 90%; text-align: center; box-shadow: 0 0 30px rgba(255, 180, 71, 0.2); }
        .custom-msg-box h3 { color: #ffb347; font-size: 20px; margin-bottom: 10px; }
        .custom-msg-box p { color: #e0e6f0; font-size: 15px; margin-bottom: 20px; line-height: 1.5; }
        .custom-msg-btn { padding: 10px 20px; border-radius: 12px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin: 0 5px; min-width: 80px; }
        .custom-msg-btn:hover { transform: scale(1.02); }
        .custom-msg-btn.confirm { background: #ffb347; color: #000; }
        .custom-msg-btn.confirm:hover { background: #ffcc66; }
        .custom-msg-btn.cancel { background: #4a1a1a; color: #ff6b6b; }
        .custom-msg-btn.cancel:hover { background: #ff6b6b; color: #fff; }
        .custom-msg-btn.ok { background: #2a3348; color: #fff; }
        .custom-msg-btn.ok:hover { background: #64ffda; color: #000; }

        /* --- МАГАЗИН И ИНВЕНТАРЬ --- */
        .top-info { display: flex; align-items: center; gap: 12px; }
        .balance-box { background: #101826; padding: 8px 16px; border-radius: 40px; font-size: 14px; border: 1px solid #2a3348; color: #f7931a; display: flex; align-items: center; gap: 6px; }
        .timer-box { background: #101826; padding: 8px 16px; border-radius: 40px; font-size: 14px; border: 1px solid #2a3348; color: #64ffda; display: flex; align-items: center; gap: 6px; }

        .packs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .pack-card { background: #111722; border-radius: 16px; padding: 16px; text-align: center; border: 2px solid #2a3348; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; position: relative; }
        .pack-card:active { transform: scale(0.95); }
        .pack-card img { width: 90px; height: 90px; object-fit: contain; margin-bottom: 8px; border-radius: 8px; background: #0b0e1a; padding: 6px; }
        .pack-card .pack-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .pack-card .pack-rarity { font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 12px; margin-bottom: 4px; }
        .pack-card .pack-price { font-size: 13px; color: #f7931a; background: #1e222d; padding: 4px 12px; border-radius: 12px; margin-top: 4px; }
        .pack-card .pack-count { font-size: 11px; color: #8892b0; margin-top: 4px; }

        .chance-btn { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; background: rgba(255,255,255,0.1); border: 1px solid #8892b0; color: #fff; border-radius: 50%; font-size: 14px; font-weight: bold; line-height: 20px; text-align: center; cursor: pointer; transition: 0.2s; z-index: 10; }
        .chance-btn:hover { background: #fff; color: #000; }

        .rarity-sigma { border-color: #ff00ff !important; background: #1a0020 !important; box-shadow: 0 0 20px rgba(255, 0, 255, 0.5) !important; }
        .rarity-sigma .pack-rarity { background: #ff00ff; color: #fff; }
        .rarity-legendary { border-color: #ffd700 !important; background: #1a1600 !important; }
        .rarity-legendary .pack-rarity { background: #ffd700; color: #000; }
        .rarity-epic { border-color: #a855f7 !important; background: #1a0b2e !important; }
        .rarity-epic .pack-rarity { background: #a855f7; color: #fff; }
        .rarity-deadly { border-color: #ef4444 !important; background: #1a0808 !important; box-shadow: 0 0 15px rgba(239, 68, 68, 0.3); }
        .rarity-deadly .pack-rarity { background: #ef4444; color: #fff; }
        .rarity-rare { border-color: #3b82f6 !important; background: #0b1a2e !important; }
        .rarity-rare .pack-rarity { background: #3b82f6; color: #fff; }
        .rarity-common { border-color: #6b7280 !important; }
        .rarity-common .pack-rarity { background: #6b7280; color: #fff; }

        .inv-packs-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .inv-pack-item { background: #111722; border: 2px solid #2a3348; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .inv-pack-item:active { transform: scale(0.95); }
        .inv-pack-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 6px; background: #0b0e1a; }
        .inv-pack-item .p-name { font-size: 12px; margin-top: 4px; }
        
        .cards-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .card-item { background: #111722; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #2a3348; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: 0.2s; }
        .card-item:hover { border-color: #64ffda; }
        .card-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; margin-bottom: 4px; background: #0b0e1a; }
        .card-item .card-img { font-size: 40px; display: block; margin-bottom: 4px; }
        .card-item .card-count { font-size: 12px; color: #8892b0; margin-bottom: 6px; }
        .card-item .card-income { font-size: 11px; color: #64ffda; font-weight: bold; margin-bottom: 6px; }
        .card-item .card-price { font-size: 11px; color: #f7931a; margin-bottom: 6px; }
        
        .equip-slots { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; padding: 15px; background: #0b0e1a; border-radius: 16px; border: 1px solid #2a3348; min-height: 70px; }
        .equip-slot { width: 50px; height: 50px; background: #111722; border: 2px dashed #2a3348; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #444; }
        .equip-slot.filled { border: 2px solid #64ffda; background: #1a2133; color: #fff; cursor: pointer; transition: 0.2s; }
        .equip-slot.filled:hover { background: #ef4444; border-color: #ef4444; transform: scale(1.05); }
        .equip-slot.filled:active { transform: scale(0.9); }

        .card-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 999; }
        .card-modal.active { display: flex; }
        .modal-content { background: #1a2133; padding: 24px; border-radius: 20px; max-width: 320px; width: 90%; border: 1px solid #2a3348; text-align: center; }
        .modal-content h3 { font-size: 20px; margin-bottom: 12px; }
        .modal-content p { font-size: 14px; color: #8892b0; margin-bottom: 16px; }
        .modal-btn { display: block; width: 100%; background: #2a3348; border: none; color: #fff; padding: 12px; border-radius: 12px; font-size: 16px; cursor: pointer; margin-bottom: 10px; transition: 0.2s; }
        .modal-btn:hover { background: #64ffda; color: #000; }
        .modal-btn.sell-btn { background: #4a1a1a; color: #ff6b6b; }
        .modal-btn.sell-btn:hover { background: #ff6b6b; color: #fff; }
        .modal-btn.close-btn { background: #2a3348; }

        .tabs-bottom { position: fixed; bottom: 0; left: 0; right: 0; max-width: 600px; margin: 0 auto; background: #111722; border-top: 1px solid #2a3348; display: flex; justify-content: space-around; align-items: center; padding: 8px 4px 12px; z-index: 100; backdrop-filter: blur(4px); }
        .tab-btn { flex: 1; display: flex; flex-direction: column; align-items: center; background: transparent; border: none; color: #8892b0; font-size: 11px; font-weight: 500; cursor: pointer; transition: 0.2s; gap: 2px; padding-top: 6px; border-radius: 12px; }
        .tab-btn .icon { font-size: 22px; line-height: 1.2; }
        .tab-btn.active { color: #64ffda; }
        @media (max-width: 480px) { .tab-btn .icon { font-size: 20px; } }

        /* --- СТИЛИ КРИПТОБИРЖИ (BINANCE) --- */
        .crypto-wallet-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0b0e11;
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #2a3348;
            margin-bottom: 20px;
        }
        .wallet-label { color: #848e9c; font-size: 12px; }
        .wallet-balance { font-weight: 700; font-size: 18px; color: #0ecb81; }
        .btn-deposit { background: #f0b90b; color: #000; font-weight: 700; padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-deposit:hover { background: #f8d44a; }
        .btn-withdraw { background: #f6465d; color: #fff; font-weight: 700; padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; transition: 0.2s; }
        .btn-withdraw:hover { background: #ff5a6f; }

        .coin-row {
            background: #1a2133;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #2a3348;
            transition: 0.2s;
        }
        .coin-row:hover { border-color: #f0b90b; }
        .coin-header { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 120px; cursor: pointer; }
        .coin-icon { width: 36px; height: 36px; background: #2b3139; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; overflow: hidden; }
        .coin-icon img { width: 100%; height: 100%; object-fit: cover; }
        .coin-name-group { display: flex; flex-direction: column; }
        .coin-symbol { font-weight: 700; font-size: 16px; }
        .coin-fullname { font-size: 12px; color: #848e9c; }
        .coin-stats { display: flex; flex-direction: column; align-items: flex-end; min-width: 100px; gap: 2px; }
        .coin-price-val { font-weight: 600; font-size: 16px; color: #0ecb81; transition: color 0.2s; }
        .coin-price-val.down { color: #f6465d; }
        .coin-marketcap { font-size: 12px; color: #848e9c; }
        .coin-actions { display: flex; gap: 8px; }
        .btn-trade { padding: 4px 12px; border-radius: 6px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .btn-buy { background: #0ecb81; color: #fff; }
        .btn-buy:hover { background: #1bd691; }
        .btn-sell { background: #f6465d; color: #fff; }
        .btn-sell:hover { background: #f75a6f; }

        .trade-panel {
            display: none;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: #0b0e11;
            border-radius: 8px;
            border: 1px solid #2a3348;
        }
        .trade-panel.open { display: block; }
        .trade-panel h4 { font-size: 14px; color: #e0e6f0; margin-bottom: 8px; }
        .trade-inputs { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .trade-inputs input[type="number"] { width: 80px; padding: 6px; background: #0b0e11; border: 1px solid #2a3348; border-radius: 4px; color: #eaecef; text-align: center; }
        .trade-inputs input[type="range"] { flex: 1; min-width: 100px; accent-color: #f0b90b; }
        .trade-buttons { display: flex; gap: 10px; margin-top: 8px; }

        /* --- СТИЛИ ДОРОЖКИ (ГОРИЗОНТАЛЬНАЯ) --- */
        .roadmap-container { display: flex; flex-direction: column; gap: 20px; padding: 10px 0; }
        .roadmap-slots { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 15px; padding-bottom: 10px; scrollbar-width: thin; scrollbar-color: #3b4a6b #0b0e11; }
        .roadmap-slots::-webkit-scrollbar { height: 6px; }
        .roadmap-slots::-webkit-scrollbar-thumb { background: #3b4a6b; border-radius: 8px; }
        .roadmap-slot {
            flex: 0 0 auto;
            width: 140px;
            background: #0b0e1a;
            border: 2px dashed #2a3348;
            border-radius: 16px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            min-height: 180px;
        }
        .roadmap-slot.filled { border: 2px solid #64ffda; background: #111722; }
        .roadmap-slot .card-img { font-size: 40px; display: block; margin-bottom: 4px; }
        .roadmap-slot .card-image { width: 80px; height: 80px; object-fit: contain; margin-bottom: 4px; border-radius: 8px; background: #0b0e1a; padding: 4px; }
        .roadmap-slot .card-name { font-size: 12px; text-align: center; margin-top: 5px; font-weight: 600; }
        .roadmap-slot .card-rarity { font-size: 10px; padding: 2px 8px; border-radius: 10px; margin-top: 4px; }
        .roadmap-slot .timer-label { font-size: 11px; color: #848e9c; margin-top: 6px; }
        .roadmap-timer-container { text-align: center; font-size: 14px; color: #64ffda; margin-top: 10px; }

        /* --- СТИЛИ МОДАЛЬНОГО ОКНА СОЗДАНИЯ КРИПТЫ --- */
        #cryptoCreateModal {
            position: fixed !important;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85) !important;
            display: none !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 9999 !important;
        }
        #cryptoCreateModal.active {
            display: flex !important;
        }
        #cryptoCreateModal .modal-box {
            max-width: 450px !important;

            border: 2px solid #ffb347 !important;

            padding: 24px !important;
            box-shadow: 0 0 30px rgba(255, 180, 71, 0.2) !important;

            display: flex !important;

            gap: 15px !important;
            margin-bottom: 15px !important;
        }
        #cryptoCreateModal .upload-preview {
            width: 60px !important;
            height: 60px !important;
